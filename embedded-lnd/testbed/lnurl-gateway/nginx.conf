# The gateway's public payment endpoint.
#
# In the product this is LQWD's: a real name, a real certificate, and one
# vhost per merchant. It is here because of a constraint that is easy to state
# and easy to get wrong:
#
#   The appliance accepts no inbound connections from the internet. It
#   therefore cannot host a public URL. But LNURL-pay is a URL the customer's
#   wallet has to fetch.
#
# So the gateway owns the name and the certificate, and proxies to the device
# over the tunnel the DEVICE dialled out to. Nothing on the internet reaches
# the device; the gateway reaches it the same way it already dials its p2p
# port to open a channel.
#
# TLS is not decoration here - wallets refuse a plain http LNURL - so the
# testbed terminates it properly, with a self-signed certificate for
# pay.testbed.local generated by scripts/61-testbed-up.sh.
#
# The listener is on loopback INSIDE the VPN container's network namespace,
# so it is reachable with docker exec and from nowhere else. Nothing about
# this stack is published on the server's public address except udp/1194.

server {
    listen 127.0.0.1:443 ssl;
    http2 on;
    server_name pay.testbed.local;

    ssl_certificate     /etc/nginx/tls/gateway.crt;
    ssl_certificate_key /etc/nginx/tls/gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Only the LNURL surface is proxied. The daemon behind this serves nothing
    # else today, but saying so here means a future endpoint on it does not
    # become public by accident.
    location ~ ^/(\.well-known/lnurlp|lnurlp)/ {
        # The appliance's lnurlpd, on the VPN. In the real deployment this is
        # the Pi at 10.99.0.10:8090; in the testbed the stand-in shares the
        # VPN container's namespace, so it is the tunnel address itself.
        proxy_pass http://10.99.0.1:8090;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A payer waiting on an invoice should get an answer or an error
        # quickly; the device is on the far side of a tunnel.
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        return 404;
    }
}
