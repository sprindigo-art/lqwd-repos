; lnd-server: the far end of the test channel.
;
; Chain backend is the regtest bitcoind running in the same network namespace.
; RPC credentials are NOT in this file - the entrypoint passes them as flags
; from the environment so they stay out of git.

[Application Options]
lnddir=/data/lnd
datadir=/data/lnd/data
logdir=/data/lnd/logs
tlscertpath=/data/lnd/tls.cert
tlskeypath=/data/lnd/tls.key

; Lightning p2p on the VPN address ONLY. This server has a public IP and
; INPUT DROP; binding 0.0.0.0 here would put the p2p port on the internet.
listen=10.99.0.1:9735
tlsextraip=10.99.0.1

; Admin interfaces on loopback. Reach them with `docker exec`, not the network.
rpclisten=127.0.0.1:10009
restlisten=127.0.0.1:8080

debuglevel=info
maxlogfiles=3

; This is a throwaway regtest node, so unlock automatically. The wallet still
; has to be created once - see scripts/62-init-server-wallet.sh.
wallet-unlock-password-file=/data/lnd/wallet-password
wallet-unlock-allow-create=true

[Bitcoin]
bitcoin.node=bitcoind
bitcoin.regtest=1

[routing]
; Blinded payment paths, which is how a BOLT 12 invoice says where to pay.
;
; lnd builds them from the PUBLIC channel graph, and this node's channel is
; unannounced, so there is no route to itself to build one from: with the
; default of at least one real hop, creating the invoice fails outright with
; "could not find any routes to self".
;
; min-num-real-hops=0 makes this node its own introduction node, which is the
; only thing an unannounced node can be. num-hops=1 pads the path with a dummy
; hop, so its length alone does not say that the introduction node is also the
; destination.
;
; The privacy limit underneath this is real and worth stating plainly: an
; offer built this way names this node. See ../docs/BOLT12.md.
routing.blinding.min-num-real-hops=0
routing.blinding.num-hops=1

[db]
db.backend=sqlite

[protocol]
protocol.wumbo-channels=true

; --- BOLT 12 (onion messages) ---
;
; BOLT 12 rides on onion messages: the invoice_request comes in over one and
; the invoice goes back out over another. lnd relays and delivers them; lndk,
; alongside, is what understands them - lnd has no offers RPC.
;
; By default lnd only admits onion messages from peers it holds an open
; channel with. The introduction node of a blinded reply path need not be one
; of those, so BOLT 12 needs this open.
protocol.onion-msg-relay-all=true
