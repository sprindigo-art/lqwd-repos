; lnd-merchant: a software stand-in for the Raspberry Pi appliance.
;
; Same binary as the Pi image and the same hardening policy, so the security
; layer can be exercised end to end on the build server without flashing an SD
; card. The Pi remains the real target - this is what you test against when it
; is not on the bench.
;
; It shares the openvpn container's network namespace with bitcoind and
; lnd-server, so every port here has to differ from the ones lnd-server uses:
;
;                  p2p            gRPC              REST
;   lnd-server     10.99.0.1:9735  127.0.0.1:10009  127.0.0.1:8080
;   lnd-merchant   10.99.0.1:9736  127.0.0.1:10010  127.0.0.1:8081
;
; lncli therefore needs --rpcserver=127.0.0.1:10010 against this node.

[Application Options]
lnddir=/data/lnd
datadir=/data/lnd/data
logdir=/data/lnd/logs
tlscertpath=/data/lnd/tls.cert
tlskeypath=/data/lnd/tls.key

listen=10.99.0.1:9736
tlsextraip=10.99.0.1

rpclisten=127.0.0.1:10010
restlisten=127.0.0.1:8081

debuglevel=info
maxlogfiles=3

; Throwaway regtest node, so unlock automatically. The wallet is created once
; by scripts/62-init-server-wallet.sh merchant.
wallet-unlock-password-file=/data/lnd/wallet-password
wallet-unlock-allow-create=true

; enable-upfront-shutdown, upfront-shutdown-address and
; security.onchain-allowlist are NOT here: the entrypoint passes them as flags
; from MERCHANT_ADDRESS, so the one provisioned address feeds both the
; cooperative-close destination and the send allowlist and cannot drift apart.

[Bitcoin]
bitcoin.node=bitcoind
bitcoin.regtest=1

[routing]
; Blinded payment paths, which is how a BOLT 12 invoice says where to pay.
;
; lnd builds them from the PUBLIC channel graph, and this node's channel is
; unannounced, so there is no route to itself to build one from: with the
; default of at least one real hop, creating the invoice fails outright with
; "could not find any routes to self".
;
; min-num-real-hops=0 makes this node its own introduction node, which is the
; only thing an unannounced node can be. num-hops=1 pads the path with a dummy
; hop, so its length alone does not say that the introduction node is also the
; destination.
;
; The privacy limit underneath this is real and worth stating plainly: an
; offer built this way names this node. See ../docs/BOLT12.md.
routing.blinding.min-num-real-hops=0
routing.blinding.num-hops=1

[db]
db.backend=sqlite

[protocol]
protocol.wumbo-channels=true

; --- BOLT 12 (onion messages) ---
;
; BOLT 12 rides on onion messages: the invoice_request comes in over one and
; the invoice goes back out over another. lnd relays and delivers them; lndk,
; alongside, is what understands them - lnd has no offers RPC.
;
; By default lnd only admits onion messages from peers it holds an open
; channel with. The introduction node of a blinded reply path need not be one
; of those, so BOLT 12 needs this open.
protocol.onion-msg-relay-all=true

[security]
; The same deny list the appliance ships with, see
; meta-embedded-lnd/recipes-lnd/lnd/files/lnd.conf. A receive-only terminal
; does not spend over Lightning, mint credentials, or let a client register
; middleware in its RPC path.
security.disable-rpc=/routerrpc.Router/SendPaymentV2
security.disable-rpc=/routerrpc.Router/SendToRouteV2
security.disable-rpc=/lnrpc.Lightning/BakeMacaroon
security.disable-rpc=/lnrpc.Lightning/RegisterRPCMiddleware
