BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "embedded-lnd"
BBFILE_PATTERN_embedded-lnd = "^${LAYERDIR}/"
BBFILE_PRIORITY_embedded-lnd = "10"

LAYERDEPENDS_embedded-lnd = "core raspberrypi"
LAYERSERIES_COMPAT_embedded-lnd = "scarthgap"

# Prebuilt lnd/lncli binaries are cross-compiled outside Yocto (see
# scripts/40-build-lnd.sh) and staged here. Not in git - they are ~40MB each.
LND_ARTIFACTS_DIR ?= "/vm/yocto/artifacts/lnd"

# Likewise for the two daemons that run beside it: lndk (BOLT 12, built by
# scripts/41-build-lndk.sh) and lnurlpd (LNURL-pay, scripts/42-build-lnurlpd.sh).
LNDK_ARTIFACTS_DIR ?= "/vm/yocto/artifacts/lndk"
LNURLPD_ARTIFACTS_DIR ?= "/vm/yocto/artifacts/lnurlpd"

# Path to the OpenVPN client profile baked into the image. Generated by the
# testbed openvpn container; contains a private key, so it is NEVER in git.
VPN_ARTIFACTS_DIR ?= "/vm/testbed/vpn/clients"
