require conf/distro/poky.conf

DISTRO = "embedded-lnd"
DISTRO_NAME = "Embedded LND"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "poc"
SDK_VENDOR = "-embeddedlndsdk"

MAINTAINER = "LQWD Tech <noreply@lqwdtech.com>"

# ---------------------------------------------------------------------------
# Attack surface: strip every feature this device does not need.
#
# Dropped vs. stock poky: alsa, argp, bluetooth, ipv6, nfc, opengl, pci,
# pcmcia, pulseaudio, usbgadget, usbhost, wayland, wifi, x11, zeroconf, 3g,
# nfs, ptest, debug.
#
# Kept: ipv4 (LAN), largefile (chain/db files), usrmerge, vfat (RPi boot
# partition), ext2 (rootfs + data partition tooling), xattr, seccomp.
# ---------------------------------------------------------------------------
DISTRO_FEATURES = "ipv4 largefile usrmerge vfat ext2 xattr seccomp"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "pulseaudio gobject-introspection-data"

# BusyBox + sysvinit. systemd would pull in a far larger surface (dbus,
# journald, resolved, networkd) for a box that runs exactly one service.
INIT_MANAGER = "sysvinit"

PACKAGE_CLASSES ?= "package_ipk"

# No on-target package manager, no dev/dbg packages, no locales.
DISTRO_FEATURES:remove = "ptest"
IMAGE_LINGUAS = ""
ENABLE_BINARY_LOCALE_GENERATION = "0"

# Serial console stays on for physical recovery. See docs/HARDENING.md before
# shipping anything real.
ENABLE_UART = "1"

# IPv6 is compiled out of the distro; also disable it in the kernel so no
# link-local address ever appears.
CMDLINE:append = " ipv6.disable=1"

# Kill the onboard radios at the device-tree level - no wifi/BT firmware is
# loaded and the interfaces never appear.
RPI_EXTRA_CONFIG = "dtoverlay=disable-wifi\ndtoverlay=disable-bt\n"

# Two-partition layout (plus boot): OS and data are separate so the rootfs can
# be replaced without touching lnd's data. See meta-embedded-lnd/wic/.
WKS_FILE = "embedded-lnd-rpi.wks"
IMAGE_FSTYPES = "wic.bz2 wic.bmap"

# Stage-2 hardening, enable after the first image is confirmed booting:
#   require conf/distro/include/security_flags.inc
