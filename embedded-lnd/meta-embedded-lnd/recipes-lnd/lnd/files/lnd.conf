; lnd configuration - Raspberry Pi 4 appliance.
;
; Data lives on the DATA PARTITION (/data, mmcblk0p3) so that reflashing the
; OS partition leaves the wallet, macaroons, TLS material and database intact.
;
; The chain backend is the regtest bitcoind on the server, reached over the
; management VPN. @BITCOIND_RPCPASS@ is substituted at build time from
; /vm/testbed/secrets - the credential is never stored in git.

[Application Options]
lnddir=/data/lnd
datadir=/data/lnd/data
logdir=/data/lnd/logs
tlscertpath=/data/lnd/tls.cert
tlskeypath=/data/lnd/tls.key

; Lightning p2p.
;
; Bound to all interfaces, but the firewall only permits 9735 on tun0 from
; 10.99.0.0/24 - so in practice this is reachable from the management VPN and
; nowhere else. That is how the server node at 10.99.0.1 dials us and opens
; the channel. Nothing on the LAN or the internet can reach it.
listen=0.0.0.0:9735

; Both addresses go in the TLS certificate so lncli works over either path.
tlsextraip=192.168.1.50
tlsextraip=10.99.0.10

; Admin interfaces bound to loopback ONLY. Use lncli over SSH.
rpclisten=127.0.0.1:10009
restlisten=127.0.0.1:8080

debuglevel=info
maxlogfiles=3

; Auto-unlock is deliberately NOT enabled here. It would mean writing the
; wallet password in plaintext to the data partition. Unlock after a reboot
; with `lncli unlock`. The throwaway server-side test node does use it.

; --- Cooperative-close destination (merchant hardware wallet) ---
;
; Commits, at channel OPEN, the on-chain script this node's balance must be
; paid to on a cooperative close. It is part of the channel and enforced by the
; protocol, so a device compromised later cannot redirect the merchant's funds.
;
; Applies to channels opened AFTER it is set, including ones this node merely
; accepts - which is the case here, since the gateway is always the opener.
;
; @MERCHANT_ADDRESS@ is substituted at build time from the merchant.env written
; by scripts/64-provision-merchant.sh, the same way the bitcoind credentials
; are. The address is per-device: it is provisioning input, not a default.
;
; NOTE: with this set, opening a channel to a peer that does not advertise
; option_upfront_shutdown_script will FAIL.
; NOTE: this governs the COOPERATIVE close only. A force close pays out via the
; commitment transaction to a key held on this device.
enable-upfront-shutdown=true
upfront-shutdown-address=@MERCHANT_ADDRESS@

[Bitcoin]
bitcoin.node=bitcoind
bitcoin.regtest=1

[Bitcoind]
; The server's regtest node, over the VPN. 10.99.0.1 is the OpenVPN server
; address, which is also the network namespace bitcoind runs in.
bitcoind.rpchost=10.99.0.1:18443
bitcoind.rpcuser=@BITCOIND_RPCUSER@
bitcoind.rpcpass=@BITCOIND_RPCPASS@
bitcoind.zmqpubrawblock=tcp://10.99.0.1:28332
bitcoind.zmqpubrawtx=tcp://10.99.0.1:28333

[routing]
; Blinded payment paths, which is how a BOLT 12 invoice says where to pay.
;
; lnd builds them from the PUBLIC channel graph, and this node's channel is
; unannounced, so there is no route to itself to build one from: with the
; default of at least one real hop, creating the invoice fails outright with
; "could not find any routes to self".
;
; min-num-real-hops=0 makes this node its own introduction node, which is the
; only thing an unannounced node can be. num-hops=1 pads the path with a dummy
; hop, so its length alone does not say that the introduction node is also the
; destination.
;
; The privacy limit underneath this is real and worth stating plainly: an
; offer built this way names this node. See ../../../../docs/BOLT12.md.
routing.blinding.min-num-real-hops=0
routing.blinding.num-hops=1

[db]
; sqlite: embedded, single file, no daemon and no listening socket. bbolt (the
; historical default) also works; postgres/etcd would add a network service and
; are deliberately not compiled in.
db.backend=sqlite

[protocol]
protocol.wumbo-channels=true

; --- BOLT 12 (onion messages) ---
;
; BOLT 12 rides on onion messages: the invoice_request comes in over one and
; the invoice goes back out over another. lnd relays and delivers them; lndk,
; alongside, is what understands them - lnd has no offers RPC.
;
; By default lnd only admits onion messages from peers it holds an open
; channel with. The introduction node of a blinded reply path need not be one
; of those, so BOLT 12 needs this open.
protocol.onion-msg-relay-all=true

[security]
; Local hardening, applied by the patches in security/ and enforced by gRPC
; interceptors that sit UNDER the macaroon layer. Nothing here is a macaroon
; permission: it holds for every caller, including the admin macaroon, and
; cannot be lifted by baking a new one. See ../../../../security/README.md.

; The only on-chain destination this device may pay is the merchant's own
; wallet - the same address the channel closes to above. Whoever ends up
; holding this device, with its admin macaroon and its wallet, still has
; exactly one place to send the money: the merchant.
;
; Setting this also closes off the RPCs that could build, sign or broadcast a
; transaction without ever naming an address - PSBT funding and signing,
; PublishTransaction, SubmitPackage, SignOutputRaw, the MuSig2 session,
; FundingStateStep. Otherwise the allowlist would be one call away from being
; bypassed. lnd logs the full list at startup.
security.onchain-allowlist=@MERCHANT_ADDRESS@

; This is a receive-only payment terminal. It takes invoices and settles them;
; it has no reason to spend over Lightning, mint credentials, or let a client
; register middleware in its RPC path.
security.disable-rpc=/routerrpc.Router/SendPaymentV2
security.disable-rpc=/routerrpc.Router/SendToRouteV2
security.disable-rpc=/lnrpc.Lightning/BakeMacaroon
security.disable-rpc=/lnrpc.Lightning/RegisterRPCMiddleware
