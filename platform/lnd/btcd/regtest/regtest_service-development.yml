apiVersion: v1
kind: Service
metadata:
  name: regtest
  namespace: btcd
  labels:
    app: regtest

spec:
  selector:
    app: regtest
  ports:

  - name: tcp-29088
    protocol: TCP
    port: 29088
    targetPort: 29088

  - name: tcp-29099
    protocol: TCP
    port: 29099
    targetPort: 29099

  - name: tcp-853
    protocol: TCP
    port: 853
    targetPort: 853
  type: NodePort

