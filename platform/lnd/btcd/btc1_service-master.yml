  name: btc1
  namespace: btcd
  labels:
    app: btc1

spec:
  selector:
    app: btc1
  ports:
  - name: tcp-29088
    protocol: TCP
    port: 29088
    targetPort: 29088

  - name: tcp-29099
    protocol: TCP
    port: 29099
