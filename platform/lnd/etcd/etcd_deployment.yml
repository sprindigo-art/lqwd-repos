apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: lqwd-lnd
  labels:
    app: etcd
spec:
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: '192.168.113.100:32000/etcd:v1.0'
          ports:
            - containerPort: 2379
              name: client
              protocol: TCP
            - containerPort: 2380
              name: server
              protocol: TCP
status: {}