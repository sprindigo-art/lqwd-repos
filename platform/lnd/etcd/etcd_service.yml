apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: lqwd-lnd
  labels:
    app: etcd

spec:
  selector:
    app: etcd
  ports:
    - name: tcp-2379
      protocol: TCP
      port: 2379
      targetPort: 2379

    - name: tcp-2380
      protocol: TCP
      port: 2380
      targetPort: 2380
  type: NodePort
