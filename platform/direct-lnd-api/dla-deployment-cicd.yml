apiVersion: apps/v1
kind: Deployment
metadata:
  name: dla
  namespace: microservice
  labels:
    app: dla
spec:
  selector:
    matchLabels:
      app: dla
  template:
    metadata:
      labels:
        app: dla
    spec:
      nodeSelector:
        nodegroup: m5l
      containers:
        - name: dla
          image: '514063904685.dkr.ecr.us-west-2.amazonaws.com/dla:staging-$BUILD_NUMBER'
          ports:
            - containerPort: 8690
          env:
            - name: WENV
              value: "stage"
            - name: ACTIVE_PROFILE
              value: "staging"
            - name: KUSERPASS
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: KUSERPASS
            - name: KADMINPASS
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: KADMINPASS
            - name: APPUSERNAME
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: APPUSERNAME
            - name: APPPASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: APPPASSWORD
            - name: DBUSERNAME
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: DBUSERNAME
            - name: DBPASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: DBPASSWORD
            - name: KSSLKEY
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: KSSLKEYPASS
            - name: KBTOKEN
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: KBTOKEN
            - name: KBCET
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: KBCET
            - name: AWSSECRET
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: AWSSECRET
            - name: AWSACCESS
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: AWSACCESS
            - name: TWILIO_ACC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: TWILIO_ACC_TOKEN
            - name: SASL_CONFIG
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: SASL_CONFIG
            - name: APP_TRUSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: TRUST_STORE_PASSWORD
            - name: ENCRYPT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: ENCRYPT_SECRET
            - name: ENCRYPT_ASD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: ENCRYPT_ASD
            - name: REDIS_CRED
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: REDIS_CRED
            - name: LND_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: LND_DB_USERNAME
            - name: LND_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: LND_DB_PASSWORD
            - name: REGTEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: BTC_REGTEST_PASS
            - name: TESTNET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: BTC_TESTNET_PASS
            - name: MAINNET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: BTC_MAINNET_PASS
            - name: STAKING_ROUTING_NODE
              value: "slnd-32610"
            - name: AWS_EC2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: AWS_EC2_ACCESS_KEY_ID
            - name: AWS_EC2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: AWS_EC2_SECRET_ACCESS_KEY
      volumes:
        - name: secret
          secret:
            secretName: secret
      imagePullSecrets:
        - name: ecr-token