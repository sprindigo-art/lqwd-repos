<!DOCTYPE html>
<html layout:decorate="~{layout/app}" lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
  <head>
    <title>LQwD | Invoice Details</title>
    <link th:href="@{${cssPath + '/scrollspyNav.css'}}" rel="stylesheet" type="text/css" />
    <link th:href="@{${cssPath + '/components/custom-modal.css'}}" rel="stylesheet" type="text/css">
    <link rel="stylesheet" type="text/css" th:href="@{${pluginPath + '/animate/animate.css'}}">

    <link th:href="@{${pluginPath + '/apex/apexcharts.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/widgets/modules-widgets.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/elements/popover.css'}}" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <section layout:fragment="sub-header">
      <span>Invoice Details</span>
    </section>

    <div layout:fragment="content-section">
      <div class="layout-px-spacing">
        <div class="row layout-spacing">
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12 layout-spacing">
            <form id="invoice-details_frm_invoice-details" class="select mt-4" novalidate action="javascript:void(0);">
              <div class="form-row">
                <h5>Invoice Details</h5>
                <div class="col-md-12">
                  <div id="invoice-details_div_lnd-select" class="form-group">
                    <select th:unless="${user.isEmailstatus()}" id="invoice-details_slct_verify" class="custom-select" required disabled>
                      <option value="">Please Verify Account</option>
                    </select>
                    <select th:if="${user.isEmailstatus()}" id="invoice-details_slct_lnd-select" class="custom-select" required>
                      <option value="">Select LND</option>
                      <option th:each="lndNodes : ${user.getLndNodes()}" th:value="${lndNodes.getLndNodeName()}" th:text="${lndNodes.getLndNodeName()}" th:selected="${(param.lnd_name != null) and (lndNodes.getLndNodeName() == param.lnd_name[0])}"></option>
                    </select>
                    <div th:if="${user.isEmailstatus()}" id="invoice-select-div" class="form-group pt-2">
                      <select id="invoice-details_slct_invoice-select" class="custom-select" required>
                        <option value="">Select Invoice</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
        <div id="invoice-detail_div_content" th:replace="invoices/fragments/invoice-widget-content"></div>
      </div>
    </div>
    <div layout:fragment="scripts">

      <!-- END GLOBAL MANDATORY SCRIPTS -->
      <script th:src="@{assets/js/scrollspyNav.js}"></script>
      <script th:src="@{${pluginPath + '/apex/apexcharts.min.js'}}"></script>
      <script th:src="@{${pluginPath + '/blockui/custom-blockui.js'}}"></script>
      <script th:src="@{${pluginPath + '/blockui/jquery.blockUI.min.js'}}"></script>
      <script th:src="@{/js/tools/tools.js}"></script>
      <script th:src="@{/js/invoices/invoice-details.js}"></script>
      <script th:src="@{assets/js/widgets/modules-widgets.js}"></script>
      <script th:src="@{assets/js/elements/popovers.js}"></script>
      <script>
        $(".clickable-link").click(function (){
          window.open($(this).attr('href'), '_self');
        });
      </script>
    </div>
  </body>
</html>
