<div th:fragment="modal-passphrase" class="modal fade text-left" id="passphraseModal" tabindex="-1" role="dialog"
     aria-labelledby="passphraseModalLabel"
     aria-hidden="true" data-check="false">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content" id="modal-passphrase-popup_div_modal-reload">
            <div class="modal-header">
                <h5 class="modal-title">Authorize</h5>
                <button id="modal-passphrase-popup_btn_close" type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="modal-passphrase-popup_frm_password">
                    <div class="form-group" id="password-div-noncustodial-modal">
                        <label for="modal-passphrase-popup_txt_password">Password</label>
                        <input type="password" class="form-control" id="modal-passphrase-popup_txt_password" placeholder="Password">
                        <small>Password used to login to LQwD Platform</small>
                    </div>
                    <div class="form-group" id="passphrase-div-noncustodial-modal">
                        <label for="modal-passphrase-popup_txt_passphrase">Passphrase</label>
                        <input type="password" class="form-control" id="modal-passphrase-popup_txt_passphrase" placeholder="Wallet Passphrase">
                        <small>Passphrase to unlock wallet</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="modal-passphrase-popup_btn_modal-dismiss" type="button" class="btn" data-dismiss="modal">
                    Close
                </button>
                <button id="modal-passphrase-popup_btn_modal-blockui" type="button" class="btn btn-primary" data-email="true">
                    Authorize
                </button>
            </div>
        </div>
    </div>
</div>
