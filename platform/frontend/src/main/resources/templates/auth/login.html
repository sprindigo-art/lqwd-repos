<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/head::header_main(~{::title}, ~{::link})">
    <title>LQWD | Login</title>
    <!-- END GLOBAL MANDATORY STYLES -->
    <link th:href="@{/assets/css/authentication/form-1.css}"  rel="stylesheet" type="text/css" />
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/forms/theme-checkbox-radio.css}" >
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/forms/switches.css}" >
    <link rel="stylesheet" type="text/css" th:href="@{/css/login.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/components/custom-modal.css}">

    <style>
        a{
            cursor: pointer !important;
        }
        .link-auth-app {
            color: #009EE2 !important;
        }
    </style>
</head>

<body class="form">

<div class="form-container">
    <div class="form-form">
        <div class="form-form-wrap">
            <div class="form-container">
                <div class="form-content">
                    <h1 class="">Log In to <a id="login_a_login" th:href="@{/}">
                        <span class="brand-name">LQwD</span>
                    </a>
                    </h1>
                    <p class="signup-link">New Here? <a id="login_a_beta" th:href="@{/beta}" >Sign Up for Our Beta!</a> Business Signup? <a id="login_a_business_signup" th:href="@{/business-signup}" >Click Here</a></p>

                        <form class="text-left" id="login_frm_login" enctype="application/x-www-form-urlencoded">
                        <div class="form">
                            <div id="login_div_email" class="field-wrapper input">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                <input type="text" id="login_txt_email" name="email" placeholder="Username or Email" class="form-control" required>
                            </div>
                            <div id="login_div_password" class="field-wrapper input mb-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-lock"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                <input id="login_txt_password" name="password" type="password" class="form-control" th:placeholder="Password" required>
                            </div>
                            <div class="d-sm-flex justify-content-between">
                                <div class="field-wrapper toggle-pass">
                                    <p class="d-inline-block">Show Password</p>
                                    <label class="switch s-primary">
                                        <input type="checkbox" id="login_chk_toggle-password" class="d-none">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div align="center" th:if="${param.error}">
                                    <p style="font-size: 20px; color: #ff1c19;" th:text="${param.error}"></p>
                                </div>
                                <div class="field-wrapper">
                                    <button id="login_btn_login" class="btn btn-primary btn-lg">Log In</button>
                                </div>

                            </div>

                            <div class="field-wrapper">
                                <a id="login_a_forgot-password" th:href="@{/forgot-password}" class="forgot-pass-link">Forgot Password?</a>
                            </div>

                            <div th:replace="auth/fragments/qrcode_modal"></div>
                            <div th:replace="auth/fragments/qrcode_login_modal::qrcode_login"></div>
                        </div>
                    </form>
                    <p class="terms-conditions">© 2021 All Rights Reserved. <a id="login_a_lqwd" href="https://lqwdfintech.com">LQwD Financial Corp</a>.
                        <br>
                        <a id="login_a_cookie" th:href="@{/cookies}">Cookie Preferences</a>,
                        <a id="login_a_privacy" th:href="@{/privacy}">Privacy</a>, and
                        <a id="login_a_terms" th:href="@{/terms}">Terms</a>.
                    </p>

                </div>
            </div>
        </div>
    </div>
    <div class="form-image">
        <div class="l-image">
        </div>
    </div>
</div>


<!-- END MAIN CONTAINER -->
<div th:replace="layout/footer::footer_main(~{::script})" >
    <script th:src="@{/assets/js/authentication/form-1.js}"></script>

    <script th:src="@{/js/auth/login.js}"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/

        $(document).ready(function() {
           var verified =  /*[[${param.verified}]]*/'';
           var forgot_password =  /*[[${param.forgot_password}]]*/'';
           var password_updated =  /*[[${param.password_updated}]]*/'';

           if(verified){
               if(verified[0] == "true") {
                   swal({
                       title: 'Thanks for Verifying!',
                       text: "Your Account is Now Verified!",
                       type: 'success',
                       padding: '2em'
                   })
               }
               if(verified[0] == "false"){
                   swal({
                       title: 'Failed to Verify Account',
                       text: "Please Try Verify Again.",
                       type: 'error',
                       padding: '2em'
                   })
               }
           }
           if(forgot_password) {
               if (forgot_password[0] == "true") {
                   swal({
                       title: 'Password Reset Email Sent',
                       text: "Please Check Email for Password Reset Link",
                       type: 'success',
                       padding: '2em'
                   })
               }
               if (forgot_password[0] == "false") {
                   swal({
                       title: 'Failed to Send Reset Email',
                       text: "Please Try Again",
                       type: 'error',
                       padding: '2em'
                   })
               }
           }

           if(password_updated) {
               if (password_updated[0] == "true") {
                   swal({
                       title: 'Password Updated!',
                       text: "Successfully Updated Password!",
                       type: 'success',
                       padding: '2em'
                   })
               }
               if (password_updated[0] == "false") {
                   swal({
                       title: 'Password Update Failed',
                       text: "Failed to Update Password",
                       type: 'error',
                       padding: '2em'
                   })
               }
           }

        });
        /*]]>*/
    </script>
</div>

</body>
</html>
