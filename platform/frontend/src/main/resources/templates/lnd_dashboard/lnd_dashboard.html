<!DOCTYPE html>
<html layout:decorate="~{layout/app}" lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>LQwD | LND Node</title>
    <link th:href="@{${cssPath + '/elements/popover.css'}}" rel="stylesheet" type="text/css"/>
    <link th:href="@{${pluginPath + '/apex/apexcharts.css'}}" rel="stylesheet" type="text/css"/>
    <link th:href="@{${pluginPath + '/jquery-step/jquery.steps.css'}}" rel="stylesheet" type="text/css"/>

    <link th:href="@{${cssPath + '/scrollspyNav.css'}}" rel="stylesheet" type="text/css" />
    <link th:href="@{${cssPath + '/widgets/modules-widgets.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/components/custom-modal.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/components/cards/card.css'}}" rel="stylesheet" type="text/css"/>
    <link th:href="@{${cssPath + '/forms/switches.css'}}" rel="stylesheet" type="text/css"/>


</head>
<style layout:fragment="style">
    .lnd-node-card:hover {
        -webkit-box-shadow: 0px 0px 50px 0px rgb(0, 158, 226);
        -moz-box-shadow: 0px 0px 50px 0px rgb(0, 158, 226);
        box-shadow: 0px 0px 50px 0px rgb(0, 158, 226);
        transition: .8s ease;
    }

    .detail-arrows:hover {
        transform: scale(1.1);
    }

    ul.mnemonic-seed-list {
        flex-wrap: wrap;
        display: flex;
        list-style: none !important;
        border: 1px solid;
    }
    ul.mnemonic-seed-list li {
        flex: 1 0 25%;
        padding: 10px;
        font-size: large;
        font-weight: bolder;
    }
    .lnd-node-card-select-session {
        cursor: pointer;
    }
</style>
<body>

<section layout:fragment="sub-header">
    <span>LND Dashboard</span>
</section>

<div layout:fragment="content-section">
    <div class="layout-px-spacing">
        <div class="account-settings-container layout-top-spacing">
            <div class="account-content">
                <div class="scrollspy-example" data-spy="scroll" data-target="#account-settings-scroll"
                     data-offset="-100">
                    <div class="row">
                        <div id="lnd-node-container" class="container-fluid h-100">
                            <div class="row">
                                <div class="col-xl-12 col-lg-12 col-md-12 layout-spacing">
                                    <div class="widget widget-table-three">
                                        <div class="widget-heading">
                                            <h5 class="">Select LND Node Below

                                            <btn id="btn-create-node" class="btn btn-primary float-right text-right bs-tooltip" data-placement="left" title="Create New LND Node" onclick="showCreateModal()">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-plus">
                                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                                </svg>
                                            </btn>
                                            </h5>
                                        </div>
                                        <div class="widget-content">
                                            <div id="lnd-node-list" th:if="${user.getLndNodes()} != null"
                                                 th:replace="lnd_dashboard/fragments/lnd_node_card::lnd_node_card(${user.getLndNodes()})"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="lnd_node/modal/authenticate-lnd-creation"></div>
        <div th:replace="lnd_dashboard/fragments/mnemonic_seed_modal"></div>
        <div th:replace="lnd_dashboard/fragments/confirm_self_manage_modal"></div>
        <div th:replace="lnd_dashboard/fragments/create_node_modal"></div>
        <div th:replace="lnd_dashboard/modals/lnd_details_modal"></div>
        <div th:replace="fragments/modal_login_popup"></div>
        <div th:replace="auth/fragments/noncustodial_passphrase_modal"></div>
    </div>
</div>
<div layout:fragment="scripts">
    <script th:src="@{${pluginPath + '/apex/apexcharts.min.js'}}"></script>
    <script th:src="@{${pluginPath + '/blockui/custom-blockui.js'}}"></script>
    <script th:src="@{${pluginPath + '/blockui/jquery.blockUI.min.js'}}"></script>
    <script th:src="@{${pluginPath + '/jquery-step/jquery.steps.min.js'}}"></script>

    <script th:src="@{/js/tools/tools.js}"></script>
    <script th:src="@{assets/js/scrollspyNav.js}"></script>
    <script th:src="@{assets/js/widgets/modules-widgets.js}"></script>
    <script th:src="@{js/lnd_dashboard/lnd_dashboard.js}"></script>
    <script th:src="@{js/lnd_node/manage_nodes.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.0.0-rc.5/dist/html2canvas.min.js"></script>
    <script th:src="@{assets/js/elements/popovers.js}"></script>

    <script>
        function showCreateModal(){
            $("#createNodeModal").modal("show");
        }
        function openDetails(lnd_name) {
            getLndNodeModalInfo(lnd_name);
            // window.open("/manage-nodes?lnd_name=" + lnd_name, "_self");
        }
        $('#authenticate-lnd-creation_txt_lndAuthModalPassword').on('keypress', function (e) {
            if (e.which === 13) {
                var password = $('#authenticate-lnd-creation_txt_lndAuthModalPassword').val();
                var network = $('#create-lnd-node_slct_select-container :selected').val();
                var routing = $('#create_lnd_node_chk_routing').is(':checked');
                var keySend = $('#create_lnd_node_chk_keysend').is(':checked');
                var passphrase = $('#lnd-node-passphrase').val();
                var passphraseType =$("#passphrase-type2").is(":checked");

                var canProceed = true
                if(!passphraseType){
                  passphrase = null
                }else{
                    if(!passphrase){
                       canProceed = false
                       Snackbar.show({
                            text: "Provide your passphrase",
                            pos: 'top-center',
                            duration: false,
                            actionTextColor: '#fff',
                            backgroundColor: '#e7515a'
                        });
                    }
                }

                if(canProceed){
                    createNode(network, password, routing, null, passphrase, keySend);
                    $("#lndAuthModal").modal('hide');
                    updateNodeList();
                }
            }
        });

        $("#example-basic").steps({
            headerTag: "h3",
            bodyTag: "section",
            transitionEffect: "slideLeft",
            autoFocus: true,
            cssClass: 'pill wizard',
            onFinished: function (event, currentIndex)
            {
                confirmSeed();
            }
        });

        $(document).ready(function () {
            updateNodeList();
            if($("#passphrase-type2").is(":checked")) {
                $("#passphrase-div").attr("hidden", false);
                $("#lnd-node-passphrase").prop("hidden",false);
                $("#create-lnd-node_svg_toggle-passphrase-open").attr("hidden",false);
                $("#create-lnd-node_svg_toggle-passphrase-close").attr("hidden",false);
                $("#lnd-node-passphrase").prop("disabled",false);
            }else{
                $("#passphrase-div").attr("hidden", true);
                $("#lnd-node-passphrase").prop("hidden",true);
                $("#lnd-node-passphrase").prop("disabled",true);
                $("#create-lnd-node_svg_toggle-passphrase-open").attr("hidden",true);
                $("#create-lnd-node_svg_toggle-passphrase-close").attr("hidden",true);
            }

            $('#passphrase-type2').on('click', function() {
                console.log($("#passphrase-type2").is(":checked"));
                if($("#passphrase-type2").is(":checked")) {
                    $("#passphrase-div").attr("hidden", false);
                    $("#lnd-node-passphrase").prop("hidden",false);
                    $("#create-lnd-node_svg_toggle-passphrase-open").attr("hidden",false);
                    $("#create-lnd-node_svg_toggle-passphrase-close").attr("hidden",false);
                    $("#lnd-node-passphrase").prop("disabled",false);
                }else{
                    $("#passphrase-div").attr("hidden", true);
                    $("#lnd-node-passphrase").prop("hidden",true);
                    $("#lnd-node-passphrase").prop("disabled",true);
                    $("#create-lnd-node_svg_toggle-passphrase-open").attr("hidden",true);
                    $("#create-lnd-node_svg_toggle-passphrase-close").attr("hidden",true);
                }
            });

            $("#create-lnd-node_svg_toggle-passphrase-open").on('click', function (){
                $("#create-lnd-node_svg_toggle-passphrase-open").addClass("d-none");
                $("#create-lnd-node_svg_toggle-passphrase-close").removeClass("d-none");
                $("#lnd-node-passphrase").attr('type', 'text');
            });

            $("#create-lnd-node_svg_toggle-passphrase-close").on('click', function (){
                $("#create-lnd-node_svg_toggle-passphrase-close").addClass("d-none");
                $("#create-lnd-node_svg_toggle-passphrase-open").removeClass("d-none");
                $("#lnd-node-passphrase").attr('type', 'password');
            });

            $("#lndAuthModal").on('shown.bs.modal', function () {
                $('#authenticate-lnd-creation_txt_lndAuthModalPassword').get(0).focus();
            });

            $("#create-lnd-node_btn_create-node").on('click', function () {
                var passphraseType =$("#passphrase-type2").is(":checked");
                $("#createNodeModal").modal('hide');
                $("#authenticate-lnd-creation_txt_lndAuthModalPassword").val("");
                if (!passphraseType){
                    $("#lndAuthModal").modal('show');
                }else{
                    $("#confirmModal").modal('show');
                }
            });

            $("#confirm-self-managed-modal-btn").on('click', function (){
                $("#confirmModal").modal('hide');
                $("#lndAuthModal").modal('show');
            });

            $("#authenticate-lnd-creation_btn_lndAuthModal-blockui").on('click', function () {
                var password = $('#authenticate-lnd-creation_txt_lndAuthModalPassword').val();
                var network = $('#create-lnd-node_slct_select-container :selected').val();
                var alias = $('#create-lnd-node_input_alias').val();
                var routing = $('#create_lnd_node_chk_routing').is(':checked');
                var keySend = $('#create_lnd_node_chk_keysend').is(':checked');
                var breez = $('#create_lnd_node_chk_breez').is(':checked');
                var passphraseType = $("#passphrase-type2").is(":checked");
                var passphrase = $('#lnd-node-passphrase').val();
                var canProceed = true

                if(!passphraseType){
                  passphrase = null
                }else{
                    if(!passphrase){
                       canProceed = false
                       Snackbar.show({
                            text: "Provide your passphrase",
                            pos: 'top-center',
                            duration: false,
                            actionTextColor: '#fff',
                            backgroundColor: '#e7515a'
                        });
                    }
                }

                if(canProceed){
                    createNode(network, password, routing,breez,alias,passphrase, keySend);
                    $("#lndAuthModal").modal('hide');
                    updateNodeList();
                }
            });

        })

        $(".clickable-link").click(function () {
            window.open($(this).attr('href'));
        });
    </script>
</div>
</body>
</html>
