<div th:fragment="modal_confirm" class="modal fade modal-notification" id="confirmModal" tabindex="-1" role="dialog" aria-hidden="true" data-check="false" data-nodeName="">
    <div class="modal-dialog modal-dialog-centered modal-md" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Creation of Self-Managed Node</h5>
                <button id="modal-confirm-popup_btn_close" type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body text-center">
                <div class="icon-content">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-bell">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </div>
                <p class="modal-text">
                    <div class="alert alert-light-danger mb-4" role="alert">
                        <strong>Warning!</strong> Please Confirm You Understand the following conditions regarding self-managed node creation.
                        <br><br>
                        Please ensure you have received seed and confirmed node with 30 min of creation or node will be unusable.
                    </div>
                </p>
            </div>
            <div class="modal-footer justify-content-center">
                <btn id="confirm-self-managed-modal-btn" class="btn btn-rounded btn-lg btn-outline-primary">Confirm</btn>
            </div>
        </div>
    </div>
</div>
