<div th:fragment="create_node_modal" class="modal fade modal-notification" id="createNodeModal" tabindex="-1" role="dialog" aria-hidden="true" data-check="false" data-nodeName="">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create LND Node</h5>
                <button id="modal-confirm-popup_btn_close" type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body text-center">
                <div class="widget-content widget-content-area">
                    <div class="form-group pt-4 mb-3">
                        <div class="form-row mb-4">
                            <div class="form-group col-6">
                                <div id="create-lnd-node_div_type-select" class="form-group">
                                    <select class="form-control" id="create-lnd-node_slct_select-container">
                                        <option value="testnet">Testnet</option>
                                        <option value="regtest">Simnet</option>
                                        <option value="mainnet">Mainnet</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group col-6">
                                <input type="text" class="form-control" id="create-lnd-node_input_alias" placeholder="Alias">
                                <small id="emailHelp1" class="form-text text-muted">Default: lqwd-lnd</small>
                            </div>
                        </div>

                        <div class="form-group mb-4" id="custom-passphrase-row">
                            <div class="row">
                                <div class="form-check col-6">
                                    <div class="custom-control custom-radio classic-radio-info">
                                        <div class="row">
                                            <div class="col align-baseline text-left">
                                                <span class="justify-content-center w-100 h-auto">Self-Managed Node</span>
                                            </div>
                                            <div class="col">
                                                <label class="switch s-icons s-outline  s-outline-info  mb-4 mr-2">
                                                    <input th:if="${user.getRole_s().contains('ADMIN')}" type="checkbox" name="passphraseType" id="passphrase-type2" class="custom-control-input passphraseType">
                                                    <input th:unless="${user.getRole_s().contains('ADMIN')}" type="checkbox" name="passphraseType" id="passphrase-type2" class="custom-control-input passphraseType" checked disabled>
                                                    <span class="slider round"></span>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col align-baseline text-left">
                                                <span class="justify-content-center w-100 h-auto">Routing Node</span>
                                            </div>
                                            <div class="col">
                                                <label class="switch s-icons s-outline  s-outline-info  mb-4 mr-2">
                                                    <input type="checkbox" name="routing" id="create_lnd_node_chk_routing" class="custom-control-input passphraseType">
                                                    <span class="slider round"></span>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col align-baseline text-left">
                                                <span class="justify-content-center w-100 h-auto">Enable KeySend</span>
                                            </div>
                                            <div class="col">
                                                <label class="switch s-icons s-outline  s-outline-info  mb-4 mr-2">
                                                    <input type="checkbox" name="keySend" id="create_lnd_node_chk_keysend" class="custom-control-input passphraseType">
                                                    <span class="slider round"></span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-check col-6">
                                    <div class="row mr-0" id="passphrase-div">
                                        <label for="lnd-node-passphrase">Enter Passphrase</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="lnd-node-passphrase" placeholder="Enter Passphrase"/>
                                            <div class="input-group-append">
                                                 <span class="input-group-text">
                                                     <!-- show passphrase -->
                                                     <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                                          id="create-lnd-node_svg_toggle-passphrase-open" class="feather feather-eye-off" hidden="true" >
                                                         <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                                         <line x1="1" y1="1" x2="23" y2="23"></line>
                                                     </svg>

                                                     <!-- hide passphrase -->
                                                     <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                                          id="create-lnd-node_svg_toggle-passphrase-close" class="feather feather-eye d-none" hidden="true" >
                                                         <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                                         <circle cx="12" cy="12" r="3"></circle>
                                                     </svg>
                                                 </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer justify-content-center">
                <div class="form-group text-right">
                    <button id="create-lnd-node_btn_verify" th:unless="${user.isEmailstatus()}" class="btn btn-primary mt-4" disabled>Please Verify Account</button>
                    <button  th:if="${user.isEmailstatus()}" id="create-lnd-node_btn_create-node"   class="btn btn-primary mt-4">Launch LND Node</button>
                </div>
            </div>
        </div>
    </div>
</div>
