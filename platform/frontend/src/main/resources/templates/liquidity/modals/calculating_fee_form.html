<!-- Modal -->
<div th:fragment="calculate_fee_form" class="modal fade slideInUp" id="calculating_fee_form" tabindex="-1"
     role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" >Liquidity Request Information</h5>
        <button id="modal-login-popup_btn_modal-dismiss" type="button" class="close" data-dismiss="modal"
                aria-label="Close">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
               viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round" class="feather feather-x">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="row pt-2">
          <div class="col-3">Liquidity Request Amount: </div>
          <div class="col-9"><span id="calculating-fee-form_span_amount"></span></div>
        </div>
        <div class="row pt-2">
          <div class="col-3">Weeks duration:</div>
          <div class="col-9"><span id="calculating-fee-form_span_weeks"></span></div>
        </div>
        <div class="row pt-2">
          <div class="col-3">Payment Type:</div>
          <div class="col-9"><span id="calculating-fee-form_span_type"></span></div>
        </div>
        <div class="row pt-2">
          <div class="col-3">Pubkey:</div>
          <div class="col-9"><span id="calculating-fee-form_span_pubkey"></span></div>
        </div>
        <div class="row pt-2">
          <div class="col-3">Node address:</div>
          <div class="col-9"><span id="calculating-fee-form_span_address"></span></div>
        </div>
        <div class="row pt-2">
          <div class="col-3">Liquidity Request Fee calculated:</div>
          <div class="col-9"><span id="calculating-fee-form_span_fee_to_pay"></span></div>
        </div>
      </div>
      <div class="modal-footer">
       <button type="button" id="calculating-fee-form_btn_pay" class="btn btn-primary">Send request</button>
      </div>
    </div>
    </div>
</div>
