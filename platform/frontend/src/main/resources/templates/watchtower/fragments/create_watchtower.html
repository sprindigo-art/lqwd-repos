<div th:fragment="create_watchtower" id="create_watchtower-form" enctype="application/x-www-form-urlencoded" xmlns="http://www.w3.org/1999/html">
  <div class="widget-content widget-content-area">
    <h3>Create Watchtower</h3>
    <div class="form-row pt-4 mb-3">
      <select class="selectpicker col-12" id="create-watchower_slct_lnd-network" required>
        <option value="">Select Network</option>
        <option value="testnet">Testnet</option>
        <option value="mainnet">Mainnet</option>
      </select>
<!--      <select class="selectpicker col-6" id="lnd-select" required>-->
<!--        <option value="">Select LND</option>-->
<!--        <option th:each="lndNode : ${lndNodes}" th:value="${lndNode.getLndNodeName()}" th:text="${lndNode.getLndNodeName()}"></option>-->
<!--      </select>-->
    </div>
    <div class="form-group text-right pb-4">
      <button id="create-watchower_btn_verify" th:unless="${user.isEmailstatus()}" data-toggle="modal" data-target="#exampleModal" class="btn btn-lg btn-primary mt-3" disabled>Please Verify Account</button>
      <button id="create-watchower_btn_create" th:if="${user.isEmailstatus()}"  data-toggle="modal" data-target="#exampleModal" class="btn btn-lg btn-primary mt-3">Create Watchtower</button>
    </div>
  </div>
</div>
