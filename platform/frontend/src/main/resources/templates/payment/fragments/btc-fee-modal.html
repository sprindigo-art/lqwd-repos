<div th:fragment="btc-fee-estimate" class="modal fade text-left" id="feeEstimateModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content" id="modal-login-popup_div_modal-reload">
            <div class="modal-header">
                <h5 class="modal-title text-center" id="exampleModalLabel">Payment Confirmation</h5>
                <button id="modal-login-popup_btn_close" type="button" class="close" aria-label="Close" onclick="closeModal()">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="todoModalText">
                    <div class="row pt-2">
                        <div class="col-5">
                            From
                        </div>
                        <div class="col-7">
                            <span class="" th:text="${lnd_name}"></span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-5">
                            Destination
                        </div>
                        <div class="col-7">
                            <span class="" th:text="${destination}"></span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-5">
                            Total Fees
                        </div>
                        <div class="col-7">
                            <span class="">[[${total_fees}]] sat</span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-5">
                            Total Amount
                        </div>
                        <div class="col-7">
                            <span class="">[[${total_amount}]] sat</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-fee-popup_btn_modal-dismiss" type="button" class="btn" onclick="closeModal()">
                    Close
                </button>
                <button id="modal-fee-popup_btn_modal-blockui" type="button" class="btn btn-primary" data-email="true"
                        th:attr="onclick=|confirmBTCFeeEstimate('${destination}', '${total_amount}')|">
                    Confirm Payment
                </button>
            </div>
        </div>
    </div>
</div>
