<!DOCTYPE html>
<html layout:decorate="~{layout/app}" lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>LQwD | Payments</title>
    <link th:href="@{${pluginPath + '/apex/apexcharts.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/widgets/modules-widgets.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/components/timeline/custom-timeline.css'}}" rel="stylesheet" type="text/css"/>
    <link th:href="@{${cssPath + '/forms/switches.css'}}" rel="stylesheet" type="text/css"/>

</head>

<body>
<section layout:fragment="sub-header">
    <span>Send Payment</span>
</section>
    <div layout:fragment="content-section">
        <div class="layout-px-spacing">
            <div class="container mw-100">
                <div class="row layout-top-spacing">
                    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 layout-spacing">
                        <div class="row">
                            <div class="col-6 col-lg-6 col-md-12 col-sm-12">
                                <div th:replace="payment/fragments/send_invoice_payment::send-invoice-payment"></div>
                            </div>
                            <div class="col-6 col-lg-6 col-md-12 col-sm-12">
                                <div th:replace="payment/fragments/send_btc_payment::send-btc-payment"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="feeEstimateModal"></div>
        <div th:replace="auth/fragments/noncustodial_passphrase_modal"></div>
    </div>
    <div layout:fragment="scripts">

        <script th:src="@{${pluginPath + '/apex/apexcharts.min.js'}}"></script>
        <script th:src="@{${pluginPath + '/blockui/custom-blockui.js'}}"></script>
        <script th:src="@{${pluginPath + '/blockui/jquery.blockUI.min.js'}}"></script>
        <script th:src="@{/js/tools/tools.js}"></script>

        <script th:src="@{/assets/js/widgets/modules-widgets.js}"></script>
        <script th:src="@{/js/payment/payment.js}"></script>
    </div>
</body>
</html>
