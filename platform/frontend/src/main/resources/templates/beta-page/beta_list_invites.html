<!DOCTYPE html>
<html layout:decorate="~{layout/app}" lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <title>Beta Signups</title>

        <link rel="stylesheet" type="text/css" th:href="@{${pluginPath + '/table/datatable/datatables.css'}}">
        <link rel="stylesheet" type="text/css" th:href="@{${pluginPath + '/table/datatable/dt-global_style.css'}}">
    </head>

    <body>
        <section layout:fragment="sub-header">
            <span>Beta Signups</span>
        </section>

        <div layout:fragment="content-section">
            <div class="layout-px-spacing">

                <div class="row layout-top-spacing">
                    <div class="col-xl-12 col-lg-12 col-sm-12 layout-spacing">
                        <div class="widget-heading pt-1">
                            <div class="">
                                <h5 class="">Beta Signups</h5>
                            </div>
                        </div>
                        <div class="widget-content widget-content-area br-6">
                            <div class="table-responsive mb-4 col-12">
                                <table id="beta-list-invites_tbl_zero-config" class="table table-hover" style="width:100%">
                                    <thead>
                                    <tr>
                                        <th>Email</th>
                                        <th>Invite Code</th>
                                        <th>Invite URL</th>
                                        <th>Used Date</th>
                                        <th>Creation Date</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="signup, num : ${signups}">
                                        <td th:text="${signup.getEmail()}">Email</td>
                                        <td th:text="${signup.getInvite_code()}">Invite Code</td>
                                        <td class="copy-value" th:value="'https://www.lqwd.tech/beta-signup?invite='+${signup.getInvite_code()}">https://www.lqwd.tech/beta-signup?invite=[[${signup.getInvite_code()}]] <i data-feather="copy" style="width: 14px; height: 14px;"></i></td>
                                        <td th:text="${signup.getUsed_by()}">Used On Date</td>
                                        <td th:text="${signup.getCreated()}">Creation Date</td>
                                    </tr>
                                    </tbody>
                                    <tfoot>
                                    <tr>
                                        <th>Email</th>
                                        <th>Invite Code</th>
                                        <th>Used Date</th>
                                        <th>Creation Date</th>
                                    </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div layout:fragment="scripts">

            <!-- END GLOBAL MANDATORY SCRIPTS -->
            <script th:src="@{${pluginPath + '/table/datatable/datatables.js'}}"></script>
            <script th:src="@{/js/beta/beta-list-invites.js}"></script>
        </div>
    </body>
</html>
