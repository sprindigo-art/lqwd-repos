    <style>

        }
        .image-login-row {

        }
        .title-header {

            font-style: normal;

            width: 100%;
            max-width: 632px;
        }

        .subtitle-header{
            font-family: Nunito Sans;
            font-style: normal;
            font-weight: 500;
            font-size: 1.5rem;
            line-height: 30px;

            color: #4B545B;
            width: 100%;
            max-width: 632px;
        }

        .login-title {
            font-family: Nunito Sans;
            font-style: normal;
            font-weight: bold;
            font-size: 36px;
            line-height: 60px;
            /* identical to box height, or 167% */

            color: #4B545B;
            padding-bottom: 40px;
        }

        .laptop-col {
            right: 0px;
            position: relative;
            bottom: 0px;
            padding-right: 0px;
        }

        .title-laptop-wrapper{
            position: absolute;

            right: 0px;
            bottom: 0px;
            top: 0;

            padding-right: 0px;

            min-height: 270px;
            max-height: 425px;

            max-width: 632px;

            height: calc(100% - 570px);
            width: 100%;
        }

        .title-laptop-row{
            position: absolute;
            bottom: 0px;
            right: 0px;
        }

        .img-laptop-row{
            max-width: calc(100% - 611px);
            max-height: calc(100% - 425px);

            object-position: right;
            position: relative;
        }

        .img-laptop {
            position: absolute;
            vertical-align: bottom;
            right: 0px !important;
            bottom: 0px !important;

            max-height: 510px;
            max-width: 720px;

            height: calc(100% - 270px);

        }
        .custom-footer {
            position: fixed;
            bottom: 0px;
            z-index: 1030;
        }

        .form-footer-col {
            padding-left: 140px;
        }

        ::placeholder{
            font-family: Nunito Sans;
            font-style: normal;
            font-weight: normal;
            font-size: 16px;
            line-height: 23px;
            /* identical to box height, or 144% */

            color: #8F8F8F;

        }

        .custom-login-btn{

            align-items: center;
            padding: 12px 25px 11px;

            height: 46px;

            background: #439EDD;
            border-radius: 50px;

            font-family: Nunito Sans;
            font-style: normal;
            font-weight: 600;
            font-size: 16px;
            line-height: 23px;
            /* identical to box height, or 144% */

            text-align: center;
            text-transform: uppercase;

            color: #FFFFFF;
        }

        .custom-login-btn:hover{
            background: #439EDD;
            color: #FFFFFF;
        }
        .custom-login-btn-outline{

            align-items: center;
            padding: 12px 25px 11px;

            height: 46px;

            /*background: #439EDD;*/
            border-radius: 50px;

            font-family: Nunito Sans;
            font-style: normal;
            font-weight: 600;
            font-size: 16px;
            line-height: 23px;
            /* identical to box height, or 144% */

            text-align: center;
            text-transform: uppercase;

            color: #439EDD;
            border: 1px solid #439EDD;
        }

        .custom-input{
            font-family: Nunito Sans;
            font-style: normal;
            font-weight: normal;

            line-height: 23px;

            max-width: 540px;
            color: #8F8F8F;
            border: 0;

        .feather {
            color: #888ea8;
            fill: rgba(0, 23, 55, 0.08);

            position: absolute;
            top: 13px;
            right: 5px;
        }

        .forgot-pass {

            font-family: Nunito Sans;
            font-style: normal;
            font-weight: 500;
            font-size: 14px;
            line-height: 20px;
            /* identical to box height, or 143% */

            text-align: center;

            color: #4B545B;

        .no-account {
            font-family: Nunito Sans;
            font-style: normal;
            font-weight: normal;

        .form-title{

            font-family: Nunito Sans;
            font-style: normal;

            font-style: normal;
            font-weight: 600;

        .form-group{

        .form-row:nth-child(even){

        .error-response {

<body style="background-color: #FFFFFF; max-width: 1920px;">
<div class="container-fluid">
    <div class="row justify-content-center vh-100">

        <!-- form and footer -->
        <div class="form-col offset-xl-1 col-xl-5 col-lg-5 col-md-12 col-sm-12 text-black d-flex flex-column justify-content-center text-xl-left text-lg-left text-md-center text-sm-center">

            <!-- logo -->
            <div class="row justify-content-xl-start justify-content-lg-start justify-content-md-center justify-content-sm-center justify-content-center image-login-row">
                <a th:href="@{/login}"><img class="image-login" src="/images/logo/LQwD-notext.png"></a>
            </div>

            <!-- form -->
            <div class="row justify-content-xl-start justify-content-lg-start justify-content-md-center justify-content-sm-center justify-content-center">

                <form class="w-100" style="max-width: 540px;">
                    <h3 class="form-title">Beta User Sign up</h3>
                    <p class="form-subtitle">Spots Remaining: 0</p>
                    <p class="no-account" style="color: rgba(75,85,91, 0.8)">Already have an account? <a th:href="@{/login}" class="link-info" style="text-decoration: underline;">Login here</a></p>
                    <div class="" id="application">
                        <div class="form-row text-left">
                            <div class="form-group col-12 text-left">
                                <input autocomplete="off" id="signup-username" name="signup-username" placeholder="Username" type="text" class="custom-input" required>
                                <span class='small error-response'></span>
                            </div>
                        </div>
                        <div class="form-row text-left">
                            <div class="form-group col-12 text-left">
                                <input id="signup-email" name="signup-email" type="text" autocomplete="off" placeholder="Email" class="custom-input" required>
                                <span class='small error-response'></span>
                            </div>
                        </div>
                        <div class="form-row text-left">
                            <div class="form-group col-12">
                                <input id="signup-password" name="signup-password" type="password" autocomplete="off" placeholder="Password" class="custom-input" required>
                                <span class='small error-response'></span>
                            </div>
                        </div>
                        <div class="d-sm-flex justify-content-between">
                            <div class="field-wrapper w-100">
                                <button id="signup_btn_submit" type="submit" class="btn btn-primary btn-lg btn-rounded rounded-pill w-100" style="background-color: #009EE2 !important; border-color: #009EE2 !important;" value="">
                                    SIGN UP
                                </button>
                            </div>
                        </div>
                    </div>
                </form>

            </div>

            <!-- footer -->
            <div class="row justify-content-xl-start justify-content-lg-start justify-content-sm-center justify-content-md-center justify-content-center">
                <div class="custom-footer mt-3">
                    <p>
                        © 2021 All Rights Reserved. <a id="registration_a_lqwd" href="https://lqwdfintech.com">LQwD FinTech Corp</a>.
                    </p>
                    <p>
                        <a id="registration_a_cookie" class="terms-conditions-links" th:href="@{/cookies}">Cookie Preferences</a>
                        <a id="registration_a_privacy" class="terms-conditions-links" th:href="@{/privacy}">Privacy</a>
                        <a id="registration_a_terms" class="terms-conditions-links" th:href="@{/terms}">Terms</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- title/subtitle and laptop -->
        <div class="col-xl-6 col-lg-7 d-none d-lg-block align-items-end laptop-col">

            <div class="title-laptop-wrapper">

                <div class="row justify-content-end title-laptop-row">
                    <h1 class="title-header">Lightning Network Infrastructure For Global Scale</h1>
                    <p class="subtitle-header">Usable anywhere in the world.</p>
                </div>

            </div>

            <img class="img-laptop" src="/images/login-image-platform.png">

        </div>
    </div>
</div>
<div th:replace="auth/fragments/qrcode_modal::qrcode"></div>
<div th:replace="auth/fragments/qrcode_login_modal::qrcode_login"></div>
<!-- END MAIN CONTAINER -->

<div th:replace="layout/footer::footer_main(~{::script})">
    <script th:src="@{plugins/dropify/dropify.min.js}"></script>
    <script th:src="@{plugins/blockui/jquery.blockUI.min.js}"></script>
    <script th:src="@{assets/js/components/ui-accordions.js}"></script>
    <script th:src="@{assets/js/authentication/form-1.js}"></script>
    <script th:src="@{js/signup/signup.js}"></script>
    <!-- Async script executes immediately and must be after any DOM elements used in callback. -->
    <script th:src="'https://maps.googleapis.com/maps/api/js?key='+${@environment.getProperty('GOOGLE_API_KEY')}+'&callback=initAutocomplete&libraries=places&v=weekly'" async></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        $(document).ready(function (){
            //check username and email on keyup
            $("#signup-username").on('change', function (){
                var email = $('#signup-email').val();
                var username = $('#signup-username').val();

                checkUsername(username, true);
                checkEmail(email, false);

            });

            $("#beta-signup_txt_email").on('change', function (){
                var email = $('#signup-email').val();
                var username = $('#signup-username').val();

                checkEmail(email, true);
                checkUsername(username, false);
            });

            //on registration submit check if user is wanting to use 2fa
            $("#signup_btn_submit").on('click', function (event){
                event.preventDefault();
                var secretKey = /*[[${@captchaSettings.getSite()}]]*/'';
                grecaptcha.ready(function() {
                    grecaptcha.execute(secretKey,
                        {action: /*[[${T(lqwd.frontend.captcha.CaptchaServiceV3).REGISTER_ACTION}]]*/''})
                        .then(function(response) {
                            register(response);
                        });
                });
            })

            $("#qrcode-modal_btn_doneQr").on('click', function (){
                $("#qrcode-modal_div_qrCodeModal").modal('hide');
                clearInputs();
                displayEnterCode();
                setCursorFocusOnFirst();
            });

            $('#qrcode-login-modal_btn_OTPSubmit').on('click', function (event){
                event.preventDefault();
                submitcode2FA();
            });

            $('#qrcode-modal_copy_code').on('click', function (){
                try {
                    var value = $(this).data('value');
                    navigator.clipboard.writeText(value);

                    Snackbar.show({
                        text: "Successfully Copied QR Code",
                        pos: 'top-center',
                        actionTextColor: '#fff',
                        backgroundColor: '#8dbf42'
                    });
                } catch (err) {
                    Snackbar.show({
                        text: "Failed to Copy QR Code",
                        pos: 'top-center',
                        actionTextColor: '#fff',
                        backgroundColor: '#e7515a'
                    });
                }

            });

        });
        /*]]>*/
    </script>
</div>

</body>
</html>
