<div th:if="${transaction != null}" id="transaction-details_div_transaction-detail-content" class="row layout-spacing"
     th:fragment="transaction-detail-content">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12 layout-spacing">
        <div class="widget">
            <div class="widget-heading">
                <h5 class="">
                    <span th:text="'Transaction: ' + ${transaction.getTx_hash()}"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-copy"
                         th:attr="onclick=|copyToClipboard('${transaction.getTx_hash()}')|">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </h5>


            </div>
            <div class="widget-content widget-content-area">
                <div>
                    <div class="row pt-2">
                        <div class="col-6">
                            Amount
                        </div>
                        <div class="col-6">
                            <span class="" th:text="${#numbers.formatDecimal(transaction.getAmount(), 1, 'COMMA', 2, 'POINT')}"></span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-6">
                            Number of Confirmations
                        </div>
                        <div class="col-6">
                            <span class="" th:text="${transaction.getNum_confirmations()}"></span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-6">
                            Block Hash
                        </div>
                        <div class="col-6">
                            <span class="" th:text="${transaction.getBlock_hash()}"></span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 class="feather feather-copy"
                                 th:attr="onclick=|copyToClipboard('${transaction.getBlock_hash()}')|">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-6">
                            Block Height
                        </div>
                        <div class="col-6">
                            <span class="" th:text="${transaction.getBlock_height()}"></span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-6">
                            Total Fees
                        </div>
                        <div class="col-6">
                            <span class="" th:text="${transaction.getTotal_fees()}"></span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-6">
                            Raw Transaction Hex
                        </div>
                        <div class="col-6">
                            <span class="" th:text="${#strings.abbreviate(transaction.getRaw_tx_hex(), 50)}"></span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 class="feather feather-copy"
                                 th:attr="onclick=|copyToClipboard('${transaction.getRaw_tx_hex()}')|">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-6">
                            Date
                        </div>
                        <div class="col-6">
                            <span class="" th:text="${transaction.getReadableDate()}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
