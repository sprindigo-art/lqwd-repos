spring:
  security:
    oauth2:
      resourceserver:
        opaque:
          introspection-uri: http://localhost:8187/oauth/check_token
          introspection-client-id: test
          introspection-client-secret: test
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: pass
    driver-class-name: org.h2.Driver
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: localhost:9092
    enable:
      auto:
        commit: true
    auto:
      commit:
        interval:
          ms: 10000
    session:
      timeout:
        ms: 30000
    consumer:
      timeout:
        ms: 120000
    jaas:
      enabled: true
    properties:
      schema:
        registry:
          url: http://localhost:8081
      security:
        protocol: PLAINTEXT
      sasl:
        mechanism: PLAIN
        jaas:
          config:
  cloud:
    bus:
      enabled: false
    stream:
      default:
        producer:
          useNativeEncoding: true
        consumer:
          useNativeEncoding: true
      bindings:
        springCloudBusOutput:
          consumer:
            useNativeDecoding: false
          producer:
            useNativeEncoding: false
        springCloudBusInput:
          consumer:
            useNativeDecoding: false
          producer:
            useNativeEncoding: false
        input:
          destination: send-email
          content-type: application/*+avro
          group: group_id
        output:
          destination: send-email
          content-type: application/*+avro
kafka:
  binder:
    key-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    schema-registry-url: http://schemaregistry.kafka-v1:8081
    key-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
    value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer

app:
  oauth-server-base-url: http://localhost:8187
  client-id: test
  client-secret: test
  subscription-create-invoice-in-days: 3