spring:
  profiles:
    active: ${ACTIVE_PROFILE}
  application:
    name: fe_microservice
  cloud:
    bus:
      enabled: true

server:
  port: 8590

---
spring:
  profiles: develop
  cloud:
    config:
      uri: ${CONFIG_SERVER:http://config-server.microservice:8888}
      label: develop
      username: ${CONFIG_USERNAME}
      password: ${CONFIG_PASSWORD}

---
spring:
  profiles: staging
  cloud:
    config:
      uri: http://config-server.microservice:8888
      label: staging
      username: ${CONFIG_USERNAME}
      password: ${CONFIG_PASSWORD}

---
spring:
  profiles: production
  cloud:
    config:
      uri: http://config-server.microservice:8888
      label: main
      username: ${CONFIG_USERNAME}
      password: ${CONFIG_PASSWORD}