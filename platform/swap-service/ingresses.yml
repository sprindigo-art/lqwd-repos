          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: nginx-prod-temp
                port:
                  number: 80
status:
  loadBalancer:
    ingress:
      - hostname: k8s-microser-frontend-e3e9b6a611-160410231.us-west-2.elb.amazonaws.com
