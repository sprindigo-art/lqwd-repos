kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: frontend
  namespace: microservice
  annotations:
    alb.ingress.kubernetes.io/actions.ssl-redirect: >-
      {"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port":
      "443", "StatusCode": "HTTP_301"}}
    alb.ingress.kubernetes.io/certificate-arn: >-
      arn:aws:acm:us-west-2:514063904685:certificate/d30209cc-7564-41d8-8c1a-bfcb5b0d72d1
    alb.ingress.kubernetes.io/inbound-cidrs: >-
      24.84.139.232/32, 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22,
      103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20,
      188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15,
      172.64.0.0/13, 131.0.72.0/22, 104.16.0.0/13, 104.24.0.0/14
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    kubernetes.io/ingress.class: alb
  finalizers:
    - ingress.k8s.aws/resources
spec:
  rules:
    - host: prodreact2022.lqwd.tech
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: ssl-redirect
                port:
