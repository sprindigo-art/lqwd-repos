
apiVersion: apps/v1
kind: Service
metadata:
  name: zk-s
  labels:
    app: zk-1
spec:
  ports:
    - name: client
      port: 2181
      protocol: TCP
    - name: follower
      port: 2888
      protocol: TCP
    - name: leader
      port: 3888
      protocol: TCP
  selector:
    app: zk-1
kind: Deployment
apiVersion: apps/v1
metadata:
  name: zk-deployment-1
spec:
  template:
    metadata:
      labels:
        app: zk-1
    spec:
      containers:
        - name: zk1
          image: 'localhost:32000/zookeeper'
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_ID
              value: "1"
            - name: ZOOKEEPER_SERVER_1
              value: zk1





