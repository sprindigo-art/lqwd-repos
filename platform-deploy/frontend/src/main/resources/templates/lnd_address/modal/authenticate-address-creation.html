<div th:fragment="lnd_address_creation" class="modal fade text-left" id="addressAuthModal" tabindex="-1" role="dialog"
     aria-labelledby="lndAuthModalLabel" aria-hidden="true" data-check="false">
    <div class="modal-dialog" role="document">
        <div class="modal-content" id="modal-reload">
            <div class="modal-header">
                <h5 class="modal-title" id="lndAuthModalLabel">Authorize</h5>
                <button id="authenticate-address-creation_btn_close" type="button" class="close" data-dismiss="modal"
                        aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="form-group">
                        <label for="authenticate-address-creation_txt_lndAuthModal-password">Password</label>
                        <input type="password" class="form-control"
                               id="authenticate-address-creation_txt_lndAuthModal-password" placeholder="Password">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="authenticate-address-creation_btn_lndAuthModal-dismiss" type="button" class="btn"
                        data-dismiss="modal">Close
                </button>
                <button id="authenticate-address-creation_btn_lndAuthModal-blockui" type="button"
                        class="btn btn-primary" data-email="true">Authorize
                </button>
            </div>
        </div>
    </div>
</div>
