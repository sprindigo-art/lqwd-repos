<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/head::header_main(~{::title}, ~{::link})">
    <title>LQWD | Password Recovery</title>
    <!-- END GLOBAL MANDATORY STYLES -->
    <link th:href="@{${cssPath + '/authentication/form-1.css'}}"  rel="stylesheet" type="text/css" />
    <link rel="stylesheet" type="text/css" th:href="@{${cssPath + '/forms/theme-checkbox-radio.css'}}" >
    <link rel="stylesheet" type="text/css" th:href="@{${cssPath + '/forms/switches.css'}}" >
    <link rel="stylesheet" type="text/css" th:href="@{/css/login.css}"/>
</head>
<body class="form">
    <div class="form-container">
        <div class="form-form">
            <div class="form-form-wrap">
                <div class="form-container">
                    <div class="form-content">

                        <h1 class="">Password Recovery</h1>
                        <p class="signup-link">Enter your email and instructions will be sent to you!</p>
                        <form class="text-left" th:action="@{/recovery}" method="POST" id="auth-recovery-password_frm_password-recovery">
                            <div class="form">
                                <div id="auth-recovery-password_div_email" class="field-wrapper input">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-at-sign"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg>
                                    <input id="auth-recovery-password_txt_email" name="email" type="text" value="" placeholder="Email">
                                </div>
                                <div class="d-sm-flex justify-content-between">
                                    <div class="field-wrapper">
                                        <button type="submit" id="auth-recovery-password_btn_reset" class="btn btn-primary" value="">Reset</button>
                                    </div>
                                </div>

                            </div>
                        </form>
                        <p class="terms-conditions">
                            © 2021 All Rights Reserved. <a id="auth-recovery-password_a_lqwd" th:href="@{/}">LQwD Financial Corp</a>.<br>
                            <a id="auth-recovery-password_a_cookie" href="javascript:void(0);">Cookie Preferences</a>,
                            <a id="auth-recovery-password_a_privacy" href="javascript:void(0);">
                            Privacy</a>, and <a id="auth-recovery-password_a_terms" href="javascript:void(0);">Terms</a>.
                        </p>

                    </div>
                </div>
            </div>
        </div>
        <div class="form-image">
            <div class="l-image">
            </div>
        </div>
    </div>


    <!-- END MAIN CONTAINER -->
    <div th:replace="layout/footer::footer_main(~{::script})" >
        <script th:src="@{assets/js/authentication/form-1.js}"></script>
    </div>

</body>
</html>
