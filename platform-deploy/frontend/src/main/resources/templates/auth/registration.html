<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/head::header_main(~{::title}, ~{::link})">
    <title>User Registration LQWD</title>
    <link th:href="@{/assets/css/authentication/form-1.css}" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/forms/theme-checkbox-radio.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/forms/switches.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/login.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/components/custom-modal.css}">
    <link th:href="@{/plugins/loaders/custom-loader.css}" rel="stylesheet" type="text/css"/>
    <!--  Recaptcha -->
    <script th:src='|https://www.google.com/recaptcha/api.js?render=${@captchaSettings.getSite()}|'></script>

</head>
<body class="form">
<div class="form-container">
    <div class="form-form">
        <div class="form-form-wrap">
            <div class="form-container">
                <div class="form-content">
                    <h1 class="">Get started with a <br/> free account</h1>
                    <p class="signup-link">Already have an account? <a id="registration_a_login" th:href="@{'login'}">Log in</a></p>
                    <form class="text-left" id="registration_frm_registration" th:action="@{/registration}" th:modelAttribute="${user}" method="POST" enctype="multipart/form-data" >
                        <div class="form">
                            <div id="registration_div_username" class="field-wrapper input">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <input id="registration_txt_username" name="username" type="text" class="form-control" placeholder="Username" required>
                                <span id="registration_span_username-response" class="text-success"></span>
                            </div>
                            <div id="registration_div_email" class="field-wrapper input">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-at-sign">
                                    <circle cx="12" cy="12" r="4"></circle>
                                    <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
                                </svg>
                                <input id="registration_txt_email" name="email" type="text" value="" placeholder="Email" required/>
                                <div class="input-group-prepend">
                                    <span id="registration_span_email-response"></span>
                                </div>
                            </div>
                            <div id="registration_div_password" class="field-wrapper input mb-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-lock">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input id="registration_txt_password" name="password" type="password" value="" placeholder="Password" required>
                            </div>
                            <div class="d-sm-flex justify-content-between">
                                <div class="field-wrapper toggle-pass">
                                    <p class="d-inline-block">Show Password</p>
                                    <label class="switch s-primary">
                                        <input type="checkbox" id="registration_chk_toggle-password" class="d-none">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div class="field-wrapper">
                                    <button id="registration_btn_register" type="submit" class="btn btn-primary btn-lg" value="">
                                        Get Started!
                                    </button>
                                </div>
                            </div>
                            <div th:replace="auth/fragments/qrcode_modal::qrcode"></div>
                            <div th:replace="auth/fragments/qrcode_login_modal::qrcode_login"></div>
                        </div>
                    </form>
                    <p class="terms-conditions">
                        © 2021 All Rights Reserved. <a id="registration_a_lqwd" href="https://lqwdfintech.com">LQwD Financial Corp</a>.<br>
                        <a id="registration_a_cookie" th:href="@{/cookies}">Cookie Preferences</a>,
                        <a id="registration_a_privacy" th:href="@{/privacy}">Privacy</a>, and
                        <a id="registration_a_terms" th:href="@{/terms}">Terms</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
    <div class="form-image">
        <div class="l-image">
        </div>
    </div>
</div>
<!-- END MAIN CONTAINER -->
<div th:replace="layout/footer::footer_main(~{::script})">
    <script th:src="@{assets/js/authentication/form-1.js}"></script>
    <script th:src="@{/js/registration.js}"></script>
    <script th:src="@{assets/js/scrollspyNav.js}"></script>
</div>

</body>
</html>
