<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/head::header_main(~{::title}, ~{::link})">
    <title>LQWD | Reset Password</title>
    <!-- END GLOBAL MANDATORY STYLES -->
    <link th:href="@{/assets/css/authentication/form-1.css}"  rel="stylesheet" type="text/css" />
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/forms/theme-checkbox-radio.css}" >
    <link rel="stylesheet" type="text/css" th:href="@{/assets/css/forms/switches.css}" >
    <link rel="stylesheet" type="text/css" th:href="@{/css/login.css}"/>
</head>

<body class="form">

<div class="form-container">
    <div class="form-form">
        <div class="form-form-wrap">
            <div class="form-container">
                <div class="form-content">
                    <form class="text-left" th:action="@{/change-password}" method="POST" enctype="application/x-www-form-urlencoded"><!--th:modelAttribute="${user}"-->
                        <div class="form">

                            <h1 class="">Reset Password</h1>
                            <div id="reset-password_div_email" class="field-wrapper input mb-2 mt-2">
                                <i data-feather="user"></i>
                                <input type="text" id="reset-password_txt_email" name="email" th:placeholder="Email" class="form-control" >
                            </div>
                            <div id="reset-password_div_password" class="field-wrapper input">
                                <i data-feather="lock"></i>
                                <input id="reset-password_txt_password" name="password" type="password" class="form-control" placeholder="Password">
                            </div>
                            <div id="reset-password_div_confirm-password" class="field-wrapper input mb-2">
                                <i data-feather="lock"></i>
                                <input id="reset-password_txt_confirm-password" name="confirm-password" type="password" class="form-control" placeholder="Confirm Password">
                            </div>
                            <div class="invalid-feedback">
                                Passwords Must Match!
                            </div>
                            <input id="reset-password_txt_token" name="token" class="form-control" th:value="${token}" type="hidden" readonly>
                            <div class="d-sm-flex justify-content-between">
                                <div class="field-wrapper toggle-pass">
                                    <p class="d-inline-block">Show Passwords</p>
                                    <label class="switch s-primary">
                                        <input type="checkbox" id="reset-password_chk_toogle-password" class="d-none">
                                        <span class="slider round"></span>
                                    </label>
                                </div>
                                <div align="center" th:if="${param.error}">
                                    <p style="font-size: 20px; color: #ff1c19;" th:text="${param.error}"></p>
                                </div>
                                <div class="field-wrapper">

                                    <button id="reset-password_btn_reset" type="submit" class="btn btn-primary" value="">Change Password</button>

                                </div>

                            </div>

                        </div>
                    </form>
                    <p class="terms-conditions">© 2021 All Rights Reserved. <a id="reset-password_a_lqwd" th:href="@{'/'}">LQwD Financial Corp</a>.
                        <br>
                        <a id="reset-password_a_cookie" href="javascript:void(0);">Cookie Preferences</a>,
                        <a id="reset-password_a_privacy" href="javascript:void(0);">Privacy</a>, and
                        <a id="reset-password_a_terms" href="javascript:void(0);">Terms</a>.
                    </p>

                </div>
            </div>
        </div>
    </div>
    <div class="form-image">
        <div class="l-image">
        </div>
    </div>
</div>


<!-- END MAIN CONTAINER -->
<div th:replace="layout/footer::footer_main(~{::script})" >
    <script th:src="@{assets/js/authentication/form-1.js}"></script>
    <script th:src="@{js/auth/reset_password.js}"></script>
</div>

</body>
</html>
