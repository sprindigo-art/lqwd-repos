<!DOCTYPE html>
<html layout:decorate="~{layout/app}" lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>LQwD | Request Liquidity</title>
    <link rel="stylesheet" type="text/css" th:href="@{${pluginPath + '/table/datatable/datatables.css'}}">
    <link rel="stylesheet" type="text/css" th:href="@{${pluginPath + '/table/datatable/dt-global_style.css'}}">
    <link  th:href="@{${pluginPath + '/animate/animate.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${pluginPath + '/apex/apexcharts.css'}}" rel="stylesheet" type="text/css">

    <link th:href="@{${cssPath + '/scrollspyNav.css'}}" rel="stylesheet" type="text/css" />
    <link th:href="@{${cssPath + '/widgets/modules-widgets.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/components/custom-modal.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/components/cards/card.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/elements/popover.css'}}" rel="stylesheet" type="text/css" />
</head>
<style layout:fragment="style">

    .custom-table-color > tbody > tr:hover{
        color: #009EE2 !important;
    }
    .custom-table-color{
        width: 100% !important;
        color: #e0e6ed !important;
        text-align: center !important;
    }
    .invoice-link {
        text-decoration: underline !important;
        cursor: pointer;
    }

    .invoice-link:hover{
        text-decoration: underline !important;
        cursor: pointer;
    }

    .feather-copy {
        cursor: pointer !important;
    }
</style>
<body>
<div layout:fragment="sub-header">
    <section>
        <span>Request Liquidity</span>
    </section>
</div>
    <div layout:fragment="content-section">
        <div class="layout-px-spacing">
            <div class="account-settings-container layout-top-spacing">
                <div class="account-content">
                    <div class="scrollspy-example" data-spy="scroll" data-target="#account-settings-scroll"
                         data-offset="-100">
                        <div class="row">
                            <div class="container-fluid h-100">
                                <div id="request-liquidity_div_request-area" class="row justify-content-center h-100 layout-spacing">
                                    <div th:replace="liquidity/fragments/liquidity-request-form"></div>
                                </div>
                                <div class="row justify-content-center h-100 layout-spacing">
                                    <div id="request-liquidity_div_lists"></div>
                            </div>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            <div th:replace="liquidity/modals/calculating_fee_form"></div>
            </div>
        <div  th:if="${liquidityInvoiceDetails} != null" th:replace="liquidity/modals/liquidity_invoice_details"></div>
        <div th:replace="liquidity/modals/qrModal"></div>
        </div>

<div layout:fragment="scripts">
    <script th:src="@{${pluginPath + '/table/datatable/datatables.js'}}"></script>
    <script th:src="@{assets/js/scrollspyNav.js}"></script>
    <script th:src="@{assets/js/widgets/modules-widgets.js}"></script>
    <script th:src="@{${pluginPath + '/apex/apexcharts.min.js'}}"></script>
    <script th:src="@{${pluginPath + '/blockui/custom-blockui.js'}}"></script>
    <script th:src="@{${pluginPath + '/blockui/jquery.blockUI.min.js'}}"></script>
    <script th:src="@{/js/liquidity/request-liquidity.js}"></script>
    <script th:src="@{/js/tools/tools.js}"></script>
</div>
</body>
</html>
