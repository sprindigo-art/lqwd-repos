    <!DOCTYPE html>
    <html layout:decorate="~{layout/app}" lang="en"
          xmlns:th="http://www.thymeleaf.org"
          xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <title>LQwD | LND Node</title>

        <link th:href="@{${pluginPath + '/apex/apexcharts.css'}}" rel="stylesheet" type="text/css">

        <link th:href="@{${cssPath + '/widgets/modules-widgets.css'}}" rel="stylesheet" type="text/css">
        <link th:href="@{${cssPath + '/scrollspyNav.css'}}" rel="stylesheet" type="text/css" />
        <link th:href="@{${cssPath + '/components/custom-modal.css'}}" rel="stylesheet" type="text/css">
        <link th:href="@{${cssPath + '/elements/popover.css'}}" rel="stylesheet" type="text/css" />
        <link th:href="@{${cssPath + '/components/cards/card.css'}}" rel="stylesheet" type="text/css">
    </head>
    <style layout:fragment="style">
        .lnd-node-card:hover {
            -webkit-box-shadow: 0px 0px 50px 0px rgb(67, 95, 229);
            -moz-box-shadow: 0px 0px 50px 0px rgb(67, 95, 229);
            box-shadow: 0px 0px 50px 0px rgb(67, 95, 229);
            transition: .8s ease;
        }

        .detail-arrows:hover {
            transform: scale(1.1);
        }
    </style>
    <body>
        <section layout:fragment="sub-header">
            <span>Watchtower</span>
        </section>

        <div layout:fragment="content-section">
            <div class="layout-px-spacing">
                <div class="account-settings-container layout-top-spacing">
                    <div class="account-content">
                        <div class="scrollspy-example" data-spy="scroll" data-target="#account-settings-scroll" data-offset="-100">
                            <div class="container-fluid h-100">
                                <div class="row justify-content-center h-100 layout-spacing">
                                    <div class="col-lg-6 col-md-12 col-12">
                                        <div id="wallet_balance" th:replace="lnd_dashboard/fragments/wallet_balance"></div>
                                    </div>
                                    <div id="watchower-dashboard_div_create-watchtower-area" class="col-lg-6 col-md-12 col-12">
                                        <div th:replace="watchtower/fragments/create_watchtower"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="container-fluid h-100">
                                <div class="row justify-content-between layout-spacing">
                                    <div class="col-xl-12 col-lg-12 col-md-12 layout-spacing">
                                        <div class="widget widget-table-three">
                                            <div class="widget-heading">
                                                <h5 class="">Watchtower Status</h5>
                                            </div>
                                            <div class="widget-content">
                                                <div id="watchower-dashboard_div_watchtower-list" th:replace="watchtower/fragments/watchtower_cards::watchtower(${user.getLndNodes()})"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:replace="lnd_node/modal/authenticate-lnd-creation"></div>
            </div>
        </div>
        <div layout:fragment="scripts">
            <script th:src="@{assets/js/scrollspyNav.js}"></script>

            <script th:src="@{${pluginPath + '/apex/apexcharts.min.js'}}"></script>
            <script th:src="@{${pluginPath + '/blockui/custom-blockui.js'}}"></script>
            <script th:src="@{${pluginPath + '/blockui/jquery.blockUI.min.js'}}"></script>
            <script th:src="@{/js/tools/tools.js}"></script>
            <script th:src="@{assets/js/widgets/modules-widgets.js}"></script>

            <script th:src="@{/js/watchtower/watchtower.js}"></script>
        </div>
    </body>
</html>
