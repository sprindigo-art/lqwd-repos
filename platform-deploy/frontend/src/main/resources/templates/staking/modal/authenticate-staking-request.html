<div th:fragment="staking_request" class="modal fade text-left" id="stakingAuthModal" tabindex="-1" role="dialog"
     aria-labelledby="stakingAuthModalLabel" aria-hidden="true" data-check="false">
    <div class="modal-dialog" role="document">
        <div class="modal-content" id="modal-reload">
            <div class="modal-header">
                <h5 class="modal-title" id="stakingAuthModalLabel">Authorize</h5>
                <button id="authenticate-staking-request_btn_close" type="button" class="close" data-dismiss="modal"
                        aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="form-group">
                        <label for="authenticate-staking-request_txt_password">Password</label>
                        <input type="password" class="form-control" placeholder="Password"
                               id="authenticate-staking-request_txt_password">
                        <input type="hidden" id="authenticate-staking-request_txt_payment_request" value="">
                        <input type="hidden" id="authenticate-staking-request_txt_request_type" value="">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="authenticate-staking-request_btn_stakingAuthModal-dismiss" type="button" class="btn"
                        data-dismiss="modal">Close
                </button>
                <button id="authenticate-staking-request_btn_stakingAuthModal-blockui" type="button"
                        class="btn btn-primary" data-email="true">Authorize
                </button>
            </div>
        </div>
    </div>
</div>
