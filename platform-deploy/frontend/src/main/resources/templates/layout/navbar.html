<div class="sub-header-container" th:fragment="sub-header(content)">
    <header class="header navbar navbar-expand-sm">
        <a th:if="${user != null}" id="navbar_a_menu" href="javascript:void(0);" class="sidebarCollapse" data-placement="bottom">
            <i data-feather="menu"></i>
        </a>

        <a th:unless="${user != null}" data-placement="bottom" href="javascript:void(0);"style="position: relative; padding: 0 25px 0 31px; margin-left: 0;">
            <i data-feather="menu"></i>
        </a>

        <ul class="navbar-nav flex-row">
            <li>
                <div class="page-header">
                    <nav class="breadcrumb-one" aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item active" aria-current="page">
                                <th:block th:replace="${content}"/>
                            </li>
                        </ol>
                    </nav>
                </div>
            </li>
        </ul>

        <ul th:if="${#session.getAttribute('lnd')} != null" class="navbar-nav flex-row ml-auto" id="session-label">
            <li>
                <div class="page-header">
                    <span th:unless="${#session.getAttribute('light')}" style="color: #FFFFFF; font-weight: 600;" th:text="'Node Selected: ' + ${#session.getAttribute('lnd')}"></span>
                    <span th:if="${#session.getAttribute('light')}" style="color: #3b3f5c; font-weight: 600;" th:text="'Node Selected: ' + ${#session.getAttribute('lnd')}"></span>
                </div>
            </li>
        </ul>
        <!--  LND Node Drop Down Selection  -->
        <ul class="navbar-item flex-row header-select-lnd-node ml-auto mr-3" id="session-select">
            <div id="select-picker-div">
                <select id="lnd-node-session-select" class="selectpicker">
                    <option>Select LND to Get Started</option>
                </select>
                <input type="hidden" th:value="${is_non_custodial}" id="select_node_custodial_state" th:if="${is_non_custodial != null}" />
            </div>
        </ul>
    </header>
</div>
