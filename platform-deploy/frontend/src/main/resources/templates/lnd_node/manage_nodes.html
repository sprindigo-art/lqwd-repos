<!DOCTYPE html>
<html layout:decorate="~{layout/app}" lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>LQwD | LND Details</title>
    <link th:href="@{${cssPath + '/scrollspyNav.css'}}" rel="stylesheet" type="text/css" />
    <link th:href="@{${cssPath + '/widgets/modules-widgets.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/components/custom-modal.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${cssPath + '/elements/popover.css'}}" rel="stylesheet" type="text/css" />
    <link th:href="@{${cssPath + '/components/cards/card.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${pluginPath + '/apex/apexcharts.css'}}" rel="stylesheet" type="text/css">
    <link th:href="@{${pluginPath + '/animate/animate.css'}}" rel="stylesheet" type="text/css">

</head>

<body>

<section layout:fragment="sub-header">
    <span>Manage LND Node</span>
</section>

<div layout:fragment="content-section">
    <div class="layout-px-spacing">
        <div class="row layout-spacing pt-2">
            <div id="manage-nodes_div_cards" class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12 layout-spacing">
                <div id="manage-nodes_div_nodes" class="widget">
                    <div class="widget-heading">
                        <h5>Manage LND Node</h5>
                    </div>
                    <div class="widget-content">
                        <select th:unless="${user.isEmailstatus()}" class="custom-select" required disabled>
                            <option value="">Please Verify Account</option>
                        </select>
                        <div class="widget-content">
                            <div id="lnd-node-list"
                                 th:replace="lnd_node/fragments/manage_lnd_node_card::#manage-lnd-node_div_lnd-node-card(${user.getLndNodes()})"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="manage-node-details" class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12 layout-spacing">
                <div th:if="${lndNode != null}">
                    <div th:replace="lnd_node/fragments/manage_node-details::#manage-node-details-widget"></div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="fragments/modal_login_popup"></div>
    <div th:replace="auth/fragments/noncustodial_passphrase_modal"></div>
</div>
<div layout:fragment="scripts">

    <!-- END GLOBAL MANDATORY SCRIPTS -->
    <script th:src="@{assets/js/scrollspyNav.js}"></script>

    <script th:src="@{${pluginPath + '/apex/apexcharts.min.js'}}"></script>
    <script th:src="@{${pluginPath + '/blockui/custom-blockui.js'}}"></script>
    <script th:src="@{${pluginPath + '/blockui/jquery.blockUI.min.js'}}"></script>

    <script th:src="@{assets/js/widgets/modules-widgets.js}"></script>
    <script th:src="@{assets/js/elements/popovers.js}"></script>
    <script th:src="@{assets/js/widgets/modules-widgets.js}"></script>
    <script th:src="@{/js/tools/tools.js}"></script>
    <script th:src="@{/js/lnd_node/manage_nodes.js}"></script>
</div>
</body>
</html>
