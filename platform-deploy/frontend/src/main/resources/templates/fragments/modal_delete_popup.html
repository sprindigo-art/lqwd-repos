<div th:fragment="modal_delete" class="modal fade modal-notification" id="standardModal" tabindex="-1" role="dialog" aria-labelledby="standardModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document" id="standardModalLabel">
        <div class="modal-content" id="modal-delete-popup_div_modal-delete">
            <div class="modal-body text-center">
                <div class="icon-content">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-bell">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </div>
                <p class="modal-text">
                   Are you sure you want to delete this API Key? <br> Enter Password to Confirm.
                </p>
                <form id="modal-delete-popup_frm_modal-delete-form">
                    <div class="form-group">
                        <input type="password" class="form-control" id="modal-delete-popup_txt_delete-api-password" placeholder="Password">
                        <input type="hidden" id="modal-delete-popup_txt_api-key-modal" value="">
                    </div>
                </form>
            </div>
            <div class="modal-footer justify-content-between">
                <button class="btn btn-primary" data-dismiss="modal" id="modal-delete-popup_btn_modal-close"><i class="flaticon-cancel-12"></i> Discard</button>
                <button type="button" class="btn btn-danger" id="modal-delete-popup_btn_modal-delete-api" onclick="deleteApiKey()">Delete</button>
            </div>
        </div>
    </div>
</div>
