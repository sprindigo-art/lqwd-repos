<div th:fragment="fee-estimate" class="modal fade text-left" id="feeEstimateModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content" id="modal-login-popup_div_modal-reload">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Payment Confirmation</h5>
                <button id="modal-login-popup_btn_close" type="button" class="close" aria-label="Close" onclick="closeModal()">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="todoModalText">
                    <div class="row pt-2">
                        <div class="col-5">
                            From
                        </div>
                        <div class="col-7">
                            <span class="" th:text="${lnd_name}"></span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-5">
                            Destination
                        </div>
                        <div class="col-7">
                            <span class="" th:text="${#strings.abbreviate(payment.getDestination(), 25)}"></span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-5">
                            Date
                        </div>
                        <div class="col-7">
                            <span class="" th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy HH:mm')}"></span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-5">
                            Total Fees
                        </div>
                        <div class="col-7">
                            <span class="">[[${feeEstimate.getTotal_fees()}]] sat</span>
                        </div>
                    </div>
                    <div class="row pt-2">
                        <div class="col-5">
                            Total Amount to Send
                        </div>
                        <div class="col-7">
                            <span class="">[[${feeEstimate.getTotal_amt()}]] sat</span>
                        </div>
                    </div>
                    <div class="row pt-4">
                        <div class="col-4">
                            Payment Route
                        </div>
                        <div class="offset-2 col-10">
                            <div class="mt-container mx-auto">
                                <div class="timeline-line">
                                    <div class="item-timeline" th:each="hops, key : ${feeEstimate.getPaymentHops()}">
                                        <div class="t-text pl-0 ml-0 pr-3">
                                            <p>[[${hops.getAlias()}]]</p>
                                            <p class="t-meta-time">Hop [[${key.index}]]</p>
                                        </div>
                                        <div class="t-dot t-dot-primary"></div>
                                        <div class="t-text">
                                            <p>Chan ID - [[${hops.getChan_id()}]]</p>
                                            <p class="t-meta-time">Fee: [[${hops.getFee()}]] sat</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-fee-popup_btn_modal-dismiss" type="button" class="btn" onclick="closeModal()">
                    Close
                </button>
                <button id="modal-fee-popup_btn_modal-blockui" type="button" class="btn btn-primary" data-email="true"
                        th:attr="onclick=|confirmFeeEstimate('${payreq}', '${feeEstimate.getTotal_amt()}')|">
                    Confirm Payment
                </button>
            </div>
        </div>
    </div>
</div>
