<div th:fragment="reset_password" id="toggleAccordion" class="section general-info">
    <div class="card">
        <div class="card-header" id="...">
            <section class="mb-0 mt-0">
                <div  class="card-title collapsed" role="menu" id="reset-password_div_expand-reset-password" data-toggle="collapse" data-target="#defaultAccordionOne" aria-expanded="true" aria-controls="defaultAccordionOne">
                    <div>

                        <h3>Reset Password
                            <span class="clickable-link bs-popover mb-4 ml-2 overflow-hidden" data-trigger="hover"
                              data-container="body" data-html="true"
                              th:data-content="'Reset Password'">
                                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="1em" height="1em" preserveAspectRatio="xMidYMid meet" viewBox="0 0 24 24">
                                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1l1-4l9.5-9.5z"/>
                                    </g>
                                </svg>
                          </span>
                        </h3>
                    </div>
                </div>
            </section>
        </div>

        <div id="defaultAccordionOne" class="collapse" aria-labelledby="..." data-parent="#toggleAccordion">
            <div class="card-body">
                <form name="reset_password" id="reset_password" action="javascript:void(0);">
                    <div class="widget-content widget-content-area">
                        <div class="row">
                            <div class="col-lg-11 mx-auto">
                                <div class="row">
                                    <div class="col-xl-10 col-lg-12 col-md-8 mt-md-0 mt-4">
                                        <div class="form">
                                            <div class="form-group">
                                                <label for="reset-password_txt_current_password">Current Password</label>
                                                <input type="password" class="form-control" id="reset-password_txt_current_password" placeholder="" value="" required>
                                                <div class="invalid-tooltip">
                                                    Please provide a current password.
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label for="reset-password_txt_new_password">New Password</label>
                                                <input type="password" class="form-control" id="reset-password_txt_new_password" placeholder="" value="" required>
                                                <div class="invalid-tooltip">
                                                    Please provide a new password.
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label for="reset-password_txt_new-password-confirm">Confirm New Password</label>
                                                <input type="password" class="form-control" id="reset-password_txt_new-password-confirm" placeholder="" value="" required>
                                            </div>
                                            <div class="form-group">

                                                <input type="hidden" name="token" id="reset-password_txt_token" th:value="${tokenKey}"  class="form-control"/>

                                            </div>
                                            <div class="form-group pb-4">
                                                <div class="row">
                                                    <div class="col-sm-2">
                                                        <button class="btn btn-primary" id="reset-password_btn_reset-password">Reset</button>
                                                    </div>
                                                    <div class="col-sm-10 text-align-left justify-content-between">
                                                        <span id="passMessage"></span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
