<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/head::header_main(~{::title}, ~{::link})">

    <!-- END GLOBAL MANDATORY STYLES -->
    <link th:href="@{/assets/css/pages/error/style-400.css}" rel="stylesheet" type="text/css" />
</head>
<body class="error404 text-center">

<div class="container-fluid">
    <div class="row">
        <div class="col-md-4 mr-auto mt-5 text-md-left text-center">
            <a id="405_a_image" th:href="@{/login}" class="ml-md-5">
                <img alt="image-404" th:src="@{/images/logo/LQwD-notext.png}" class="theme-logo">

        </div>

<div th:replace="layout/footer::footer_main(~{::script})">
