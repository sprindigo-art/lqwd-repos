apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: kafka-v1
  labels:
    app: broker

spec:
  selector:
    app: broker
  ports:
    - name: client
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: clientssl
      port: 9093
      targetPort: 9093
      protocol: TCP
