apiVersion: v1
kind: Service
metadata:
  name: schemaregistry
  namespace: kafka-v1
  labels:
    app: schemaregistry

spec:
  selector:
    app: schemaregistry
  ports:
    - name: schema
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: zookeeper
      port: 2181
      targetPort: 2181
