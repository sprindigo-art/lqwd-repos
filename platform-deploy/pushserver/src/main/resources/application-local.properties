# Loading Filters
zuul.filters.root=src/main/groovy/com/lqwd/zuul/push/filters
zuul.filters.locations=${zuul.filters.root}/inbound,${zuul.filters.root}/outbound,${zuul.filters.root}/endpoint
zuul.filters.packages=com.netflix.zuul.filters.common
# Will use for Web socket
zuul.server.port.main=7001
# Will use for http based end point for push submission
zuul.server.port.http.push=7008
#redis config
redis.port=6379
redis.host=localhost
zuul.push.auth.oauth.url=http://localhost:8187/oauth/check_token
zuul.push.auth.oauth.client-id=lqwd-front-end-microservice2
zuul.push.auth.oauth.client-secret=${CLIENT_SECRET}

zuul.push.sse.allowed.origins=localhost,react-dev.lqwd.tech,react-stage.lqwd.tech,prodreact2022.lqwd.tech,lqwd.tech
zuul.push.keepalive.enabled=true
zuul.push.keepalive.interval.seconds=30