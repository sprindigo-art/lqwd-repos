kind: Deployment
apiVersion: apps/v1
metadata:
  name: messaging
  namespace: microservice
  labels:
    app: messaging
  annotations:
    deployment.kubernetes.io/revision: '3'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messaging
  template:
    metadata:
      labels:
        app: messaging
    spec:
      nodeSelector:
        nodegroup: m5l
      volumes:
        - name: frontend-secret
          secret:
            secretName: frontend-secret
            defaultMode: 420
      imagePullSecrets:
        - name: ecr-token
      containers:
        - name: config-server
          image: '514063904685.dkr.ecr.us-west-2.amazonaws.com/messaging-service:staging-$BUILD_NUMBER'
          ports:
            - containerPort: 8589
              protocol: TCP
          env:
            - name: MENV
              value: staging
            - name: CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: CONFIG_PASSWORD
            - name: CONFIG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: CONFIG_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: MAIL_PASSWORD
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: MAIL_USERNAME
            - name: SASL_CONFIG
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: SASL_CONFIG
            - name: REDIS_CRED
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: REDIS_CRED
