spring:
  liquibase:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: pass
    initialization-mode: always
    hikari:
      connection-timeout: 10000
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      poolName: DLAJPAHikariCP
      testWhileIdle: true
      validationQuery: SELECT 1
      leak-detection-threshold: 150000
    jpa:
      hibernate:
        ddl-auto: create
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQL95Dialect
          format_sql: true
          id:
            new_generator_mappings: true
          jdbc:
            lob:
              non_contextual_creation: true
    driver-class-name: org.h2.Driver
    platform: h2
  kafka:
    bootstrap-servers: lqwd-staging-internal-lb-b37fd245ab641750.elb.us-east-2.amazonaws.com:30806
    enable:
      auto:
        commit: true
    auto:
      commit:
        interval:
          ms: 10000
    session:
      timeout:
        ms: 30000
    consumer:
      timeout:
        ms: 120000
    jaas:
      enabled: false
    properties:
      security:
        protocol: PLAINTEXT
      sasl:
        mechanism: PLAIN
        jaas:
          config:

  cloud:
    bus:
      enabled: false
    stream:
      default:
        producer:
          useNativeEncoding: true
        consumer:
          useNativeEncoding: true
      bindings:
        springCloudBusOutput:
          consumer:
            useNativeDecoding: false
          producer:
            useNativeEncoding: false
        springCloudBusInput:
          consumer:
            useNativeDecoding: false
          producer:
            useNativeEncoding: false
        input:
          destination: tmessage-details
          content-type: application/*+avro
          group: group-1
          concurrency: 3
        output:
          destination: tmessage-details
          content-type: application/*+avro
      kafka:
        binder:
          consumer-properties:
            specific:
              avro:
                reader: true
  tls:
    admin: src/main/resources/
  mvc:
    log-request-details: true

kafka:
  listener:
    auto-startup: false
  binder:
    key-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    schema-registry-url: https://lqwd-staging-internal-lb-b37fd245ab641750.elb.us-east-2.amazonaws.com:30807
    key-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
    value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer

logging:
  level:
    com:
      zaxxer:
        hikari: debug
    org:
      springframework:
        security:
          oauth2: debug
        web: DEBUG
      hibernate:
        SQL: debug
        type:
