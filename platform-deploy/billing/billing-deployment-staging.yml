kind: Deployment
apiVersion: apps/v1
metadata:
  name: billing
  namespace: microservice
  labels:
    app: billing
  annotations:
    deployment.kubernetes.io/revision: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      volumes:
        - name: billing-secret
          secret:
            secretName: billing-secret
            defaultMode: 420
      nodeSelector:
        nodegroup: m5l
      containers:
        - name: billing
          image: '514063904685.dkr.ecr.us-west-2.amazonaws.com/billing:staging-$BUILD_NUMBER'
          ports:
            - containerPort: 8790
              protocol: TCP
          env:
            - name: ENV
              value: staging
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: DB_PASSWORD
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: APP_USERNAME
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: APP_PASSWORD
            - name: TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: TRUSTSTORE_PASSWORD
            - name: INVOICE_LND_CERT
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: INVOICE_LND_CERT
            - name: INVOICE_LND_MACAROON
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: INVOICE_LND_MACAROON
            - name: INVOICE_LND_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: INVOICE_LND_PUBKEY
            - name: SASL_CONFIG
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: SASL_CONFIG
            - name: COINMARKETCAP_API
              valueFrom:
                secretKeyRef:
                  name: billing-secret
                  key: COINMARKETCAP_API
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: ecr-token
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
