databaseChangeLog:
  - changeSet:
      validCheckSum: ANY
      id: set_user_email_not_null
      author: femi
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: user_
            columnName: created_at
      changes:
        - addColumn:
            tableName: user_
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false