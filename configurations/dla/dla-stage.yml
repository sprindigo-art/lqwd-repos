spring:
  datasource:
    url: jdbc:postgresql://lnd.csxgoms2cude.us-east-2.rds.amazonaws.com:5433/lnd
    username: ${DBUSERNAME}
    password: ${DBPASSWORD}
    initialization-mode: always
    hikari:
      connection-timeout: 10000
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      poolName: DLAJPAHikariCP
      testWhileIdle: true
      validationQuery: SELECT 1
      leak-detection-threshold: 150000
    jpa:
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQL95Dialect
          format_sql: true
          id:
            new_generator_mappings: true
          jdbc:
            lob:
              non_contextual_creation: true
  kafka:
    bootstrap-servers: broker.kafka-v1:9092
    enable:
      auto:
        commit: true
    auto:
      commit:
        interval:
          ms: 10000
    session:
      timeout:
        ms: 30000
    consumer:
      timeout:
        ms: 120000
    jaas:
      enabled: true
    properties:
      security:
        protocol: SASL_PLAINTEXT
      sasl:
        mechanism: PLAIN
        jaas:
          config: ${SASL_CONFIG}

  cloud:
    stream:
      default:
        producer:
          useNativeEncoding: true
        consumer:
          useNativeEncoding: true
      bindings:
        springCloudBusOutput:
          consumer:
            useNativeDecoding: false
          producer:
            useNativeEncoding: false
        springCloudBusInput:
          consumer:
            useNativeDecoding: false
          producer:
            useNativeEncoding: false
        input:
          destination: tmessage-details
          content-type: application/*+avro
          group: group-1
          concurrency: 3
        output:
          destination: tmessage-details
          content-type: application/*+avro
      kafka:
        binder:
          consumer-properties:
            specific:
              avro:
                reader: true
  http:
    log-request-details: true
  tls:
    admin: src/main/resources/

kafka:
  binder:
      key-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      schema-registry-url: http://schemaregistry.kafka-v1:8081
      key-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer

logging:
  level:
    com:
      zaxxer:
        hikari: debug
    org:
      springframework:
        security:
          oauth2: debug
        web: DEBUG
      hibernate:
        SQL: debug
        type:
          descriptor:
            sql: trace

hibernate:
  show_sql: true

log4j:
  logger:
    org:
      hibernate:
        type: trace

