spring:
  application:
    name: breez
  datasource:
    url: jdbc:postgresql://${DBHOST:postgres-lnd.postgres-v1}:5435/lnd
    username: ${DBUSERNAME}
    password: ${DBPASSWORD}
    initialization-mode: always
    hikari:
      connection-timeout: 10000
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      poolName: DLAJPAHikariCP
      testWhileIdle: true
      validationQuery: SELECT 1
      leak-detection-threshold: 150000
    jpa:
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQL95Dialect
          format_sql: true
          id:
            new_generator_mappings: true
          jdbc:
            lob:
              non_contextual_creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:broker.kafka-v1:9092}
    enable:
      auto:
        commit: true
    auto:
      commit:
        interval:
          ms: 10000
    session:
      timeout:
        ms: 30000
    consumer:
      timeout:
        ms: 120000
    jaas:
      enabled: true
    properties:
      security:
        protocol: SASL_PLAINTEXT
      sasl:
        mechanism: PLAIN
        jaas:
          config: ${SASL_CONFIG}
    admin:
      ssl:
        key-password: ${KAFKA_SSL_KEY_PASSWORD}
        key-store-location: file:src/main/resources/kafka.server.keystore.jks
        key-store-password: ${KAFKA_SSL_KEY_STORE_PASSWORD}
        trust-store-location: file:src/main/resources/kafka.server.truststore.jks
        trust-store-password: ${KAFKA_SSL_TRUST_STORE_PASSWORD}
  cloud:
    stream:
      default:
        producer:
          useNativeEncoding: true
        consumer:
          useNativeEncoding: true
      bindings:
        input:
          destination: tmessage-details
          content-type: application/*+avro
          group: group-1
          concurrency: 3
        output:
          destination: tmessage-details
          content-type: application/*+avro
      kafka:
        binder:
          producer-properties:
            key:
              serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
            value:
              serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
            schema:
              registry:
                url: ${SCHEMA_REGISTRY:schemaregistry.kafka-v1:8081}
          consumer-properties:
            key:
              deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
            value:
              deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
            schema:
              registry:
                url: ${SCHEMA_REGISTRY:schemaregistry.kafka-v1:8081}
            specific:
              avro:
                reader: true
  http:
    log-request-details: true
  tls:
    admin: src\\main\\resources\\

logging:
  level:
    com:
      zaxxer:
        hikari: debug
    org:
      springframework:
        security:
          oauth2: debug
        web: DEBUG
      hibernate:
        SQL: debug
        type:
          descriptor:
            sql: trace

hibernate:
  show_sql: true

log4j:
  logger:
    org:
      hibernate:
        type: trace

server:
  ssl:
    enabled: false

app:
  location: dev
  wenv: dev
  auth_post_url: ${AUTH_HOST:oauth2.oauth2}
  auth_post_port: 8187
  auth_user_name: ${APPUSERNAME}
  auth_password: ${APPPASSWORD}
  auth_grand_type: password
  truststore:
    password: ${TRUST_STORE_PASSWORD}
    location: src\\main\\resources\\server.truststore
  lnd_files_encode_key: ${LND_FILES_ENCODE_KEY}
  lnd:
    location: http://localhost:8080
    file_encodes_key_path: ${LND_FILES_ENCODE_KEY_PATH}

security:
  oauth2:
    resource:
      token-info-uri: http://${AUTH_HOST:oauth2.oauth2}:8187/oauth/check_token
    client:
      client-id: ${APPUSERNAME}
      client-secret: ${APPPASSWORD}