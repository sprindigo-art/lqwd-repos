[Service]
# Override the 512M/50% caps from the base openclaw-nodeops unit.
#
# The upstream OpenClaw service file ships with MemoryMax=512M and
# CPUQuota=50%, which is too tight for an AI agent running Gemini 3.1
# Pro with 6 plugins. In 2026-04 this caused a 5-day silent crash loop
# (3943+ systemd restarts) with the process OOM-ing every ~2 minutes
# and taking the Telegram bot offline.
#
# The VM has 31GB RAM + plenty of CPU, so giving this process real
# runway is safe. At steady-state the agent sits ~500MB; 4GB cap gives
# ~8x headroom. If memory ever climbs past 3GB, investigate a real leak.
#
# Install on the VM with:
#   sudo mkdir -p /etc/systemd/system/openclaw-nodeops.service.d/
#   sudo install -m 644 -o root -g root \
#     scripts/openclaw-nodeops.service.d/override.conf \
#     /etc/systemd/system/openclaw-nodeops.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart openclaw-nodeops.service
MemoryMax=4G
CPUQuota=400%
Environment=NODE_OPTIONS=--max-old-space-size=3584

# Restart=always (not on-failure). OpenClaw issues clean SIGUSR1 restarts
# when config changes (e.g. swapping the agent model or API credentials).
# With Restart=on-failure those land as status=0/SUCCESS and systemd
# leaves the service dead. Added 2026-04-21 after a xAI/Grok config swap
# took the Telegram bot offline until manually restarted.
Restart=always
